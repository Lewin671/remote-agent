<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="880" height="456" role="img" aria-label="Animated overview: Claude Code runs natively in tmux on your computer and asks to run go test; the request is encrypted and crosses a relay you host, which sees only IDs, timestamps and sizes; you approve it on your phone; the same session carries on; the next message is sent from the phone. Also: Codex and Claude Code, live terminal, images, start and fork sessions, many computers, Web, Android and iOS (preview) clients.">
