<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Your devices talk to your computer through a relay that only sees ciphertext">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .box { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
    .title { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13px; fill: #9198a1; }
    .tag { font-size: 12px; fill: #9198a1; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .lock { font-size: 12px; font-weight: 600; fill: #3fb950; }
    .inner { fill: #212830; stroke: #3d444d; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="60" width="230" height="180" rx="12"/>
  <text class="title" x="40" y="92">Your devices</text>
  <text class="sub" x="40" y="114">anywhere</text>
  <rect class="inner" x="40" y="132" width="190" height="36" rx="8"/>
  <text class="mono" x="54" y="155">Web app (PWA)</text>
  <rect class="inner" x="40" y="178" width="190" height="36" rx="8"/>
  <text class="mono" x="54" y="201">Android app</text>

  <rect class="box" x="325" y="60" width="230" height="180" rx="12"/>
  <text class="title" x="345" y="92">Your relay</text>
  <text class="sub" x="345" y="114">a small VPS you run</text>
  <rect class="inner" x="345" y="132" width="190" height="36" rx="8"/>
  <text class="mono" x="359" y="155">remote-agent-server</text>
  <text class="tag" x="345" y="194">Routes and stores ciphertext.</text>
  <text class="tag" x="345" y="212">Never holds a key.</text>

  <rect class="box" x="630" y="60" width="230" height="180" rx="12"/>
  <text class="title" x="650" y="92">Your computer</text>
  <text class="sub" x="650" y="114">where the code lives</text>
  <rect class="inner" x="650" y="132" width="190" height="36" rx="8"/>
  <text class="mono" x="664" y="155">remote-agent daemon</text>
  <rect class="inner" x="650" y="178" width="190" height="36" rx="8"/>
  <text class="mono" x="664" y="201">tmux › codex / claude</text>

  <path class="line" d="M256 150H319" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M561 150H624" marker-start="url(#a)" marker-end="url(#a)"/>

  <path class="line" d="M135 250V272H745V250" stroke-dasharray="4 4"/>
  <rect x="352" y="261" width="176" height="22" fill="#0d1117" stroke="none" class="pill"/>
  <text class="lock" x="440" y="277" text-anchor="middle">end-to-end encrypted</text>

  <text class="tag" x="287" y="140" text-anchor="middle">HTTPS</text>
  <text class="tag" x="592" y="140" text-anchor="middle">HTTPS</text>
</svg>
