version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Lewin671/remote-agent/clientcore/gen
plugins:
  - local: ["go", "run", "./cmd/protoc-gen-go-lite"]
    out: clientcore/gen
    strategy: all
    opt:
      - paths=source_relative
      - entries=cmd/protoc-gen-go-lite/entries.txt
      - Mgoogle/protobuf/timestamp.proto=github.com/Lewin671/remote-agent/clientcore/gen/timestamppb
