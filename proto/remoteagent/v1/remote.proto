syntax = "proto3";

package remoteagent.v1;

import "remoteagent/v1/event.proto";
import "remoteagent/v1/local.proto";

// Inner-layer messages exchanged between clients and daemons. They only
// ever travel inside an Envelope.

// MachineMeta describes a computer running a daemon.
message MachineMeta {
  string hostname = 1;
  string os = 2;
  // The Codex account's latest usage limits seen on this machine.
  RateLimit primary_limit = 3;
  RateLimit secondary_limit = 4;
  string plan_type = 5;
  // Home folder, for choosing where to start sessions.
  string home = 6;
}

// Command is what a client asks a daemon to do. The session operations
// reuse the local API's messages; the envelope header carries the request
// ID and deadline.
message Command {
  oneof kind {
    SendRequest send = 1;
    InterruptRequest interrupt = 2;
    ResolveApprovalRequest resolve_approval = 3;
    AnswerQuestionRequest answer_question = 4;
    StopSessionRequest stop_session = 5;
    CancelInputRequest cancel_input = 6;
    SetModelRequest set_model = 7;
    SetApprovalModeRequest set_approval_mode = 8;
    CompactRequest compact = 9;
    AnswerPlanRequest answer_plan = 10;
    // Commands for the machine rather than a session; their envelope
    // header names no session.
    CreateSessionRequest create_session = 20;
    ListModelsRequest list_models = 21;
    ListDirectoriesRequest list_directories = 22;
    GetSettingsRequest get_settings = 23;
    UpdateSettingsRequest update_settings = 24;
  }
}

// CommandResult is the daemon's reply to a Command. A retried request ID
// gets the original result instead of running the command again.
message CommandResult {
  // Connect error code name ("not_found", "unimplemented", ...); empty on
  // success. "unimplemented" means the daemon does not know the command.
  string error_code = 1;
  string error_message = 2;

  oneof kind {
    SendResponse send = 10;
    InterruptResponse interrupt = 11;
    ResolveApprovalResponse resolve_approval = 12;
    AnswerQuestionResponse answer_question = 13;
    StopSessionResponse stop_session = 14;
    CancelInputResponse cancel_input = 15;
    SetModelResponse set_model = 16;
    SetApprovalModeResponse set_approval_mode = 17;
    CompactResponse compact = 18;
    AnswerPlanResponse answer_plan = 19;
    CreateSessionResponse create_session = 30;
    ListModelsResponse list_models = 31;
    ListDirectoriesResponse list_directories = 32;
    GetSettingsResponse get_settings = 33;
    UpdateSettingsResponse update_settings = 34;
  }
}
