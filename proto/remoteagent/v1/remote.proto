syntax = "proto3";

package remoteagent.v1;

import "remoteagent/v1/event.proto";
import "remoteagent/v1/local.proto";
import "remoteagent/v1/relay.proto";

// Inner-layer messages exchanged between clients and daemons. They only
// ever travel inside an Envelope.

// MachineMeta describes a computer running a daemon.
message MachineMeta {
  string hostname = 1;
  string os = 2;
  // The Codex account's latest usage limits seen on this machine.
  RateLimit primary_limit = 3;
  RateLimit secondary_limit = 4;
  string plan_type = 5;
  // Home folder, for choosing where to start sessions.
  string home = 6;
  // `codex --version`, and whether this remote-agent has been checked
  // against it (by its tests or `remote-agent doctor`).
  string codex_version = 7;
  bool codex_verified = 8;
  // The CLIs installed on this machine; a client offers only these when
  // starting a session. Empty from daemons older than Claude Code support,
  // which only run Codex.
  repeated AgentInfo agents = 9;
  // What this daemon supports beyond the base protocol. Absent from
  // daemons older than v2: a client then offers none of it and says the
  // computer needs updating.
  MachineCapabilities capabilities = 10;
}

message MachineCapabilities {
  // Images in the session carry ImageRefs and display copies (GetImage).
  bool session_images = 1;
  // The image upload commands, and image IDs in Send and CreateSession.
  bool image_upload = 2;
  int32 max_images_per_message = 3;
  // Largest file BeginImageUpload accepts.
  int64 max_upload_bytes = 4;
  // Largest data in one PutImageChunk.
  int32 max_chunk_bytes = 5;
  // Formats BeginImageUpload accepts.
  repeated ImageFormat upload_formats = 6;
  // Commands are checked against Envelope.signature and events carry
  // their Origin.
  bool command_signatures = 7;
}

message AgentInfo {
  Agent agent = 1;
  string version = 2;
  // Whether this remote-agent has been checked against that version.
  bool verified = 3;
  // The approval mode a session started without one gets: the daemon's
  // default for this CLI if set (DaemonSettings), else the CLI's own
  // configuration as the daemon reads it (Claude Code:
  // permissions.defaultMode in managed and user settings; Codex:
  // approval_policy, sandbox_mode and approvals_reviewer in config.toml,
  // with the selected profile). UNSPECIFIED with a known source is a mode
  // outside the four, such as Claude Code's accept edits. A client asks
  // for confirmation before starting a session in FULL_ACCESS, and also
  // when the source is unknown.
  ApprovalMode default_mode = 4;
  DefaultModeSource default_mode_source = 5;
  // Project settings in the session's folder may give another default
  // (Claude Code's .claude/settings.json and settings.local.json). The
  // daemon checks the folder when the session is created; see
  // CreateSessionRequest.confirm_full_access.
  bool default_mode_varies = 6;
}

enum DefaultModeSource {
  // Not known: an older daemon, or the configuration could not be read.
  DEFAULT_MODE_SOURCE_UNSPECIFIED = 0;
  DEFAULT_MODE_SOURCE_DAEMON_SETTINGS = 1;
  DEFAULT_MODE_SOURCE_CLI_CONFIG = 2;
}

// Command is what a client asks a daemon to do. The session operations
// reuse the local API's messages; the envelope header carries the request
// ID and deadline.
message Command {
  oneof kind {
    SendRequest send = 1;
    InterruptRequest interrupt = 2;
    ResolveApprovalRequest resolve_approval = 3;
    AnswerQuestionRequest answer_question = 4;
    StopSessionRequest stop_session = 5;
    CancelInputRequest cancel_input = 6;
    SetModelRequest set_model = 7;
    SetApprovalModeRequest set_approval_mode = 8;
    CompactRequest compact = 9;
    AnswerPlanRequest answer_plan = 10;
    OpenTerminalRequest open_terminal = 11;
    ResumeSessionRequest resume_session = 12;
    // Commands for the machine rather than a session; their envelope
    // header names no session.
    CreateSessionRequest create_session = 20;
    ListModelsRequest list_models = 21;
    ListDirectoriesRequest list_directories = 22;
    GetSettingsRequest get_settings = 23;
    UpdateSettingsRequest update_settings = 24;
    BeginImageUploadRequest begin_image_upload = 25;
    PutImageChunkRequest put_image_chunk = 26;
    GetImageUploadStatusRequest get_image_upload_status = 27;
    CompleteImageUploadRequest complete_image_upload = 28;
    AbortImageUploadRequest abort_image_upload = 29;
  }
}

// CommandResult is the daemon's reply to a Command. A retried request ID
// gets the original result instead of running the command again.
message CommandResult {
  // Connect error code name ("not_found", "unimplemented", ...); empty on
  // success. "unimplemented" means the daemon does not know the command.
  string error_code = 1;
  string error_message = 2;

  oneof kind {
    SendResponse send = 10;
    InterruptResponse interrupt = 11;
    ResolveApprovalResponse resolve_approval = 12;
    AnswerQuestionResponse answer_question = 13;
    StopSessionResponse stop_session = 14;
    CancelInputResponse cancel_input = 15;
    SetModelResponse set_model = 16;
    SetApprovalModeResponse set_approval_mode = 17;
    CompactResponse compact = 18;
    AnswerPlanResponse answer_plan = 19;
    OpenTerminalResponse open_terminal = 20;
    ResumeSessionResponse resume_session = 21;
    CreateSessionResponse create_session = 30;
    ListModelsResponse list_models = 31;
    ListDirectoriesResponse list_directories = 32;
    GetSettingsResponse get_settings = 33;
    UpdateSettingsResponse update_settings = 34;
    BeginImageUploadResponse begin_image_upload = 35;
    PutImageChunkResponse put_image_chunk = 36;
    GetImageUploadStatusResponse get_image_upload_status = 37;
    CompleteImageUploadResponse complete_image_upload = 38;
    AbortImageUploadResponse abort_image_upload = 39;
  }
}

// OpenTerminalRequest asks the daemon to stream a session's terminal. The
// client and the daemon each connect to the server's /v1/term with the
// stream ID, and the server joins the two connections.
message OpenTerminalRequest {
  string session_id = 1;
  // 128 random bits, hex.
  string stream_id = 2;
}

message OpenTerminalResponse {}

// TerminalFrame is the content of a TERMINAL_OUTPUT or TERMINAL_INPUT
// envelope.
message TerminalFrame {
  oneof kind {
    // Daemon to client.
    TerminalSnapshot snapshot = 1;
    bytes output = 2;
    // Why the daemon ended the stream.
    string closed = 3;
    // Client to daemon: bytes typed, as if on the local keyboard.
    bytes input = 10;
    TerminalResize resize = 11;
  }
}

// TerminalSnapshot is the screen as it is now; output continues from it.
message TerminalSnapshot {
  bytes data = 1;
  int32 cols = 2;
  int32 rows = 3;
}

// TerminalResize with fit set resizes the tmux window to the client's
// screen; without it the window goes back to following attached terminals.
message TerminalResize {
  int32 cols = 1;
  int32 rows = 2;
  bool fit = 3;
}

// PairingPayload is what an existing device hands a new one.
message PairingPayload {
  bytes root = 1;
  string server = 2;
}

// NotifyContent is what a daemon tells the Android app in a push, sealed
// with the notify key so that the server and FCM only see ciphertext.
message NotifyContent {
  string machine_id = 1;
  string session_id = 2;
  NotifyKind kind = 3;
  // The session's title.
  string title = 4;
  // One line about what happened, e.g. the question asked.
  string text = 5;
  // Set for a permission request, so that it can be decided from the
  // notification.
  NotifyApproval approval = 6;
}

message NotifyApproval {
  string approval_id = 1;
  string tool_name = 2;
  string description = 3;
  // The command line of a shell request, shortened; truncated says
  // whether all of it (or of tool_input) is here.
  string command = 4;
  bool truncated = 5;
  // Unix milliseconds after which the request is denied.
  int64 deadline_ms = 6;
  // For a request that is not a command (e.g. Write): its input as JSON,
  // shortened. Daemons before this field put it in command.
  string tool_input = 7;
}

// ImagePayload is the content of an IMAGE envelope: the display copy of an
// image in a session, re-encoded by the daemon (long side at most 2048,
// the whole envelope at most 1 MiB). A client checks that data starts
// with the format's signature before showing it.
message ImagePayload {
  ImageFormat format = 1;
  int32 width = 2;
  int32 height = 3;
  bytes data = 4;
}

// DeviceMeta is the content of a DEVICE_META envelope: what the account's
// clients call a client device. Machines describe themselves in
// MachineMeta instead.
message DeviceMeta {
  // Name the user gave the device, e.g. "Pixel".
  string name = 1;
  // "web", "android", ...
  string platform = 2;
  // What the device says it runs on, e.g. "Chrome 140 on macOS".
  string description = 3;
}

// ProjectPrefs is the content of the ACCOUNT_PREFS object "project-prefs":
// the account's pinned and hidden projects. A project is its absolute
// path, as in the client's grouping.
message ProjectPrefs {
  // 1 for this layout.
  int32 schema = 1;
  // Pinned projects in the order they were pinned.
  repeated ProjectPref pinned = 2;
  // Projects removed from the project list.
  repeated ProjectPref hidden = 3;
  // IDs of the latest operations applied (at most 64, newest last), so a
  // client whose write reply was lost can tell whether its operation is
  // in.
  repeated string recent_ops = 4;
}

message ProjectPref {
  string path = 1;
  // Unix milliseconds when it was pinned or hidden.
  int64 since_ms = 2;
}
