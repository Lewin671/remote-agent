syntax = "proto3";

package remoteagent.v1;

import "remoteagent/v1/envelope.proto";

// Services of remote-agent-server. Everything the server can read is
// routing metadata: IDs, sequence numbers, times and sizes. Content only
// appears inside envelopes.

// AuthService registers devices and logs them in. Every device has its own
// Ed25519 key. The first device of an account signs its registration with
// the account key; every later device on an existing account needs a
// approval signed by the current authority client instead.
service AuthService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc GetChallenge(GetChallengeRequest) returns (GetChallengeResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  // A relay that lets anyone create an account asks for a proof of work
  // instead of a setup token: RegisterDevice refuses a new account with
  // FAILED_PRECONDITION, and the client solves a challenge from here.
  rpc GetSignupChallenge(GetSignupChallengeRequest) returns (GetSignupChallengeResponse);
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  // A computer running the daemon; its device ID is its machine ID.
  DEVICE_KIND_MACHINE = 1;
  // A browser or other client.
  DEVICE_KIND_CLIENT = 2;
}

// DeviceRegistration is signed by the account key.
message DeviceRegistration {
  bytes account_public_key = 1;
  bytes device_public_key = 2;
  DeviceKind kind = 3;
  int64 created_ms = 4;
}

message RegisterDeviceRequest {
  // Serialized DeviceRegistration.
  bytes registration = 1;
  // Ed25519 signature by the account key over "remote-agent/v1/register\x00"
  // followed by registration. Required only to create the account.
  bytes signature = 2;
  // Required only to create the account, i.e. for the first device, on a
  // relay that creates accounts with a setup token.
  string setup_token = 3;
  // Required only to create the account on a relay open to anyone.
  SignupProof signup_proof = 4;
  // One-use approval signed by a currently enrolled device; required to add
  // a device to an existing account. Never replaced by root-key possession.
  bytes approval = 5;
  bytes approval_signature = 6;
  uint32 protocol_version = 7;
}

message GetSignupChallengeRequest {}

message GetSignupChallengeResponse {
  bytes challenge = 1;
  // SHA-256 of challenge followed by the nonce must start with this many
  // zero bits.
  uint32 difficulty_bits = 2;
  int64 expires_ms = 3;
}

// A solved signup challenge; each challenge creates one account at most.
message SignupProof {
  bytes challenge = 1;
  bytes nonce = 2;
}

message RegisterDeviceResponse {
  string device_id = 1;
}

message GetChallengeRequest {
  string device_id = 1;
}

message GetChallengeResponse {
  // Random bytes, valid for one login within a minute.
  bytes challenge = 1;
}

message LoginRequest {
  string device_id = 1;
  bytes challenge = 2;
  // Ed25519 signature by the device key over "remote-agent/v1/login\x00"
  // followed by challenge.
  bytes signature = 3;
  uint32 protocol_version = 4;
}

message LoginResponse {
  // Bearer token for the other services and the stream.
  string token = 1;
  int64 expires_ms = 2;
  bytes device_public_key = 3;
}

// PairingService delivers admission and content-key material from the current
// authority client (the initiator) to a new device (the joiner) without the
// server learning it; see internal/e2e/pair.go. The account root is not sent.
// The initiator is logged in; the joiner uses the candidate token it gets
// when joining.
service PairingService {
  // Freeze this response before exposing the joiner ephemeral public key.
  rpc PeekPairing(PeekPairingRequest) returns (PeekPairingResponse);
  rpc CreatePairing(CreatePairingRequest) returns (CreatePairingResponse);
  rpc JoinPairing(JoinPairingRequest) returns (JoinPairingResponse);
  rpc GetPairing(GetPairingRequest) returns (GetPairingResponse);
  rpc RevealPairing(RevealPairingRequest) returns (RevealPairingResponse);
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);
  rpc CancelPairing(CancelPairingRequest) returns (CancelPairingResponse);
}

message CreatePairingRequest {
  // SHA-256 commitment to the initiator's X25519 public key.
  bytes commit = 1;
}

message CreatePairingResponse {
  string pairing_id = 1;
  // Eight digits the joiner types or scans.
  string code = 2;
  int64 expires_ms = 3;
  // Public identity for non-extractable browser signing keys.
  bytes approver_public_key = 4;
}

// Exact device identity approved after the users compare the pairing SAS.
message PairApproval {
  string account_id = 1;
  string pairing_id = 2;
  string approver_device_id = 3;
  bytes approver_public_key = 4;
  bytes candidate_device_public_key = 5;
  DeviceKind candidate_kind = 6;
  int64 expires_ms = 7;
  bytes nonce = 8;
  // Authority-approved archive transfer from this revoked machine identity.
  string replaces_device_id = 9;
}

message PeekPairingRequest { string code = 1; uint32 protocol_version = 2; }
message PeekPairingResponse { string pairing_id = 1; bytes commit = 2; }

message JoinPairingRequest {
  string code = 1;
  bytes joiner_public = 2;
  DeviceKind joiner_kind = 3;
  // Ed25519 signing identity, generated before comparing the SAS.
  bytes device_public_key = 4;
  // Independent long-term X25519 recipient key, bound by the SAS.
  bytes device_hpke_public_key = 5;
  uint32 protocol_version = 6;
}

message JoinPairingResponse {
  string pairing_id = 1;
  bytes commit = 2;
  // Authorizes this joiner's GetPairing and CancelPairing.
  string candidate_token = 3;
}

enum PairingState {
  PAIRING_STATE_UNSPECIFIED = 0;
  // Waiting for a joiner.
  PAIRING_STATE_OPEN = 1;
  // A joiner sent its key; the initiator reveals its own next.
  PAIRING_STATE_JOINED = 2;
  // Both keys are known; the user compares the emoji.
  PAIRING_STATE_REVEALED = 3;
  // The initiator sent the sealed admission payload.
  PAIRING_STATE_APPROVED = 4;
  PAIRING_STATE_CANCELED = 5;
  // The joiner confirmed it received the admission payload and joined. Only this tells the
  // initiator that pairing went through; the pairing is kept a minute to
  // say so.
  PAIRING_STATE_DELIVERED = 6;
}

message GetPairingRequest {
  string pairing_id = 1;
  // The joiner's token; the initiator uses its login instead.
  string candidate_token = 2;
  // Set by the joiner once it has opened the admission payload and joined:
  // the server then drops the payload and tells the initiator. Until then
  // the joiner can fetch the payload again, e.g. after a lost response.
  bool received = 3;
}

message GetPairingResponse {
  PairingState state = 1;
  bytes commit = 2;
  bytes joiner_public = 3;
  DeviceKind joiner_kind = 4;
  bytes initiator_public = 5;
  // PAIRING envelope, for the joiner once approved.
  Envelope payload = 6;
  bytes device_public_key = 7;
  bytes device_hpke_public_key = 8;
  // The initiator's public PairTrustDescriptor, revealed with its ephemeral
  // key. It carries account, domain, genesis hash and approver, no secret.
  bytes trust = 9;
}

message RevealPairingRequest {
  string pairing_id = 1;
  bytes initiator_public = 2;
  // Public PairTrustDescriptor. The pairing commitment must match it.
  bytes trust = 3;
}

message RevealPairingResponse {}

message ApprovePairingRequest {
  string pairing_id = 1;
  Envelope payload = 2;
  bytes approval = 3;
  bytes approval_signature = 4;
}

message ApprovePairingResponse {}

message CancelPairingRequest {
  string pairing_id = 1;
  string candidate_token = 2;
}

message CancelPairingResponse {}

// ClientService is used by clients.
service ClientService {
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc ListRemoteSessions(ListRemoteSessionsRequest) returns (ListRemoteSessionsResponse);
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse);
  // Forward delivers a sealed command to a daemon and waits for its sealed
  // result. It fails with "unavailable" at once when the daemon is offline;
  // the server never queues commands.
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // Web Push: the server's VAPID public key, and this device's
  // subscription with the kinds of notifications it wants.
  rpc GetPushKey(GetPushKeyRequest) returns (GetPushKeyResponse);
  rpc SetPushSubscription(SetPushSubscriptionRequest) returns (SetPushSubscriptionResponse);
  // SetPushTarget registers where this device gets notifications, one
  // target per type: Web Push and FCM can be set side by side.
  // SetPushSubscription is the same for Web Push.
  rpc SetPushTarget(SetPushTargetRequest) returns (SetPushTargetResponse);
  // GetImage returns the display copy of an image in a session.
  rpc GetImage(GetImageRequest) returns (GetImageResponse);
  // ListDevices lists the account's devices, machines and clients.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // PutDeviceMeta replaces a client device's sealed metadata if its
  // revision is still the expected one.
  rpc PutDeviceMeta(PutDeviceMetaRequest) returns (PutDeviceMetaResponse);
  // Account preference objects, stored sealed and replaced with a check
  // of the expected revision.
  rpc GetAccountPrefs(GetAccountPrefsRequest) returns (GetAccountPrefsResponse);
  rpc PutAccountPrefs(PutAccountPrefsRequest) returns (PutAccountPrefsResponse);
  // PinSecurityDomain stores the authority-signed genesis state of a new
  // account. Called once, by the new authority client.
  rpc PinSecurityDomain(PinSecurityDomainRequest) returns (PinSecurityDomainResponse);
  // PutSecurityState uploads a contiguous signed state chain segment. The
  // first state must continue from the stored head (or be the pinned
  // genesis). The server rejects forks, rollbacks and invalid signatures.
  rpc PutSecurityState(PutSecurityStateRequest) returns (PutSecurityStateResponse);
  // GetSecurityStates returns states after an epoch, up to eight at a time.
  rpc GetSecurityStates(GetSecurityStatesRequest) returns (GetSecurityStatesResponse);
  rpc DeleteMachineRecords(DeleteMachineRecordsRequest) returns (DeleteMachineRecordsResponse);
}

message Machine {
  string id = 1;
  bool online = 2;
  // MACHINE_META envelope, absent until the daemon uploads one.
  Envelope meta = 3;
  int64 last_seen_ms = 4;
}

message RemoteSession {
  string machine_id = 1;
  string session_id = 2;
  // SESSION_KEY envelope.
  Envelope key = 3;
  // SESSION_META envelope.
  Envelope meta = 4;
  // Highest event sequence number stored on the server.
  uint64 last_seq = 5;
  int64 updated_ms = 6;
  // When the session ended, as its daemon told the server in the clear so
  // that ended sessions can be listed a page at a time; 0 while it has
  // not ended. It only places the session in the listing: what a client
  // shows comes from the sealed metadata.
  int64 ended_ms = 7;
}

// SessionCursor is a place in the listing of ended sessions, which runs
// from the latest ended_ms to the earliest, and by session ID where
// those are equal.
message SessionCursor {
  int64 ended_ms = 1;
  string session_id = 2;
}

message StoredEvent {
  uint64 seq = 1;
  // EVENT envelope.
  Envelope envelope = 2;
}

message ListMachinesRequest {}

message ListMachinesResponse {
  repeated Machine machines = 1;
}

// The listing comes a page at a time. The first page (no cursor) holds
// every session that has not ended, then the latest ended ones; each
// further page holds the ended sessions after the cursor. With
// session_ids set, the answer is just those sessions, as far as they
// exist, and neither cursor nor limit applies.
message ListRemoteSessionsRequest {
  SessionCursor after = 1;
  // At most this many ended sessions; the server caps it.
  uint32 limit = 2;
  repeated string session_ids = 3;
}

message ListRemoteSessionsResponse {
  repeated RemoteSession sessions = 1;
  // The cursor for the next page, unset when this was the last.
  SessionCursor next = 2;
}

message GetEventsRequest {
  string session_id = 1;
  // Only events with seq greater than this are returned.
  uint64 after_seq = 2;
  // At most this many events; the server caps it.
  uint32 limit = 3;
}

message GetEventsResponse {
  repeated StoredEvent events = 1;
  // More events follow the last one returned.
  bool more = 2;
}

message ForwardRequest {
  string machine_id = 1;
  // COMMAND envelope. Its header's sender must be the calling device, or
  // the server refuses it.
  Envelope command = 2;
}

message ForwardResponse {
  // COMMAND_RESULT envelope.
  Envelope result = 1;
}

// MachineService is used by daemons.
service MachineService {
  rpc PutMachine(PutMachineRequest) returns (PutMachineResponse);
  rpc PutSession(PutSessionRequest) returns (PutSessionResponse);
  // UploadEvents appends events in order. Events the server already has
  // are skipped, so uploads can be retried; a gap is rejected.
  rpc UploadEvents(UploadEventsRequest) returns (UploadEventsResponse);
  rpc ListSessionHeads(ListSessionHeadsRequest) returns (ListSessionHeadsResponse);
  // Notify asks the server to push a notification with generic text.
  rpc Notify(NotifyRequest) returns (NotifyResponse);
  // PutImage stores the display copy of an image in one of the machine's
  // sessions. Storing an image ID again is a no-op. Fails with
  // "resource_exhausted" when the account's image quota is full.
  rpc PutImage(PutImageRequest) returns (PutImageResponse);
}

message PutMachineRequest {
  Envelope meta = 1;
}

message PutMachineResponse {}

message PutSessionRequest {
  string session_id = 1;
  // Required when the session is new, ignored afterwards: the session key
  // never changes.
  Envelope key = 2;
  Envelope meta = 3;
  // When the session in meta ended, 0 if it has not. Read with meta; the
  // server keeps it in the clear to page the listing of ended sessions.
  int64 ended_ms = 4;
  // Clear routing metadata only; task identity remains encrypted.
  bool task_owned = 5;
}

message PutSessionResponse {}

message UploadEventsRequest {
  string session_id = 1;
  repeated StoredEvent events = 2;
}

message UploadEventsResponse {
  uint64 last_seq = 1;
}

message ListSessionHeadsRequest {}

message SessionHead {
  string session_id = 1;
  uint64 last_seq = 2;
  // Revision of the stored SESSION_META, 0 if none.
  uint64 meta_revision = 3;
  // The ended_ms stored with it.
  int64 ended_ms = 4;
  // Clear routing metadata only; task identity remains encrypted.
  bool task_owned = 5;
}

message ListSessionHeadsResponse {
  repeated SessionHead sessions = 1;
}

// The stream is a WebSocket at /v1/stream carrying binary protobuf frames.
// The peer sends StreamHello first; the server answers with Ready or closes
// the connection.

message StreamHello {
  string token = 1;
}

// PeerFrame is sent by a client or daemon.
message PeerFrame {
  oneof kind {
    StreamHello hello = 1;
    ForwardReply forward_reply = 2;
  }
}

// ServerFrame is sent by the server.
message ServerFrame {
  oneof kind {
    Ready ready = 1;
    // Visible to browsers, which cannot observe WebSocket Ping/Pong.
    Heartbeat heartbeat = 10;
    // To clients.
    EventsAppended events_appended = 2;
    SessionUpdated session_updated = 3;
    MachineUpdated machine_updated = 4;
    MachineRemoved machine_removed = 6;
    AccountPrefsUpdated account_prefs_updated = 7;
    DeviceUpdated device_updated = 8;
    DeviceRemoved device_removed = 9;
    // To daemons.
    ForwardCall forward_call = 5;
  }
}

message Heartbeat {}

message Ready {
  int64 server_time_ms = 1;
}

// EventsAppended is pushed after the events are stored.
message EventsAppended {
  string machine_id = 1;
  string session_id = 2;
  repeated StoredEvent events = 3;
}

message SessionUpdated {
  RemoteSession session = 1;
}

message MachineUpdated {
  Machine machine = 1;
}

// MachineRemoved says a machine and its sessions were deleted.
message MachineRemoved {
  string machine_id = 1;
}

message ForwardCall {
  // Server-chosen ID matching the reply to the call.
  uint64 call_id = 1;
  Envelope command = 2;
  // The logged-in device that called Forward, and its registration with
  // the account's signature as stored at RegisterDevice. The daemon checks
  // the registration against the account key and the envelope's
  // signature against the device key, so a server cannot make up a
  // sender; without a signature the sender is unverified.
  string sender_device_id = 3;
  bytes sender_registration = 4;
  bytes sender_registration_signature = 5;
}

message ForwardReply {
  uint64 call_id = 1;
  Envelope result = 2;
  // Set when the daemon could not produce a sealed result, e.g. the
  // envelope did not open. The text never contains content.
  string error = 3;
}

// Terminal streams use a WebSocket at /v1/term. Each side first sends a
// TermHello; afterwards every binary message is a serialized Envelope,
// which the server passes to the other side without storing it.
message TermHello {
  string token = 1;
  string stream_id = 2;
  // Set by the client: the machine that must join the stream.
  string machine_id = 3;
}

message GetPushKeyRequest {}

message GetPushKeyResponse {
  // VAPID public key, base64url.
  string public_key = 1;
}

enum NotifyKind {
  NOTIFY_KIND_UNSPECIFIED = 0;
  // A permission request or a question waits for the user.
  NOTIFY_KIND_ATTENTION = 1;
  // A turn ended.
  NOTIFY_KIND_TURN_ENDED = 2;
  // A recovery is pending on the account's authority client. Generic text
  // only; the app opens the device page.
  NOTIFY_KIND_SECURITY = 3;
  NOTIFY_KIND_SCHEDULED = 4;
}

message SetPushSubscriptionRequest {
  // The PushSubscription as JSON; empty removes this device's subscription.
  string subscription_json = 1;
  // Kinds of notifications to send.
  repeated NotifyKind kinds = 2;
}

message SetPushSubscriptionResponse {}

message PinSecurityDomainRequest { bytes genesis_state = 1; }
message PinSecurityDomainResponse {}

// One signed state and, only for a recovery transition, the
// RecoveryStatement that authorized the new authority member.
message SecurityState {
  bytes state = 1;
  bytes recovery = 2;
}

message PutSecurityStateRequest {
  // Contiguous; the first parent must be the stored head.
  repeated SecurityState states = 1;
  bytes lease = 2; // independent canonical signed head lease
}
message PutSecurityStateResponse {
  uint64 head_epoch = 1;
  bytes head = 2;
}

message GetSecurityStatesRequest {
  uint64 after_epoch = 1;
  uint32 limit = 2; // the server caps it at 8
}
message GetSecurityStatesResponse {
  repeated SecurityState states = 1;
  uint64 head_epoch = 2;
  // Set for the current authority client while a recovery is pending, with
  // the time it may complete. Only the signed-in authority client sees this;
  // the unauthenticated recovery service no longer answers it.
  bool recovery_pending = 3;
  uint64 recovery_ready_ms = 4;
  bytes lease = 5;
}

// RecoveryService transfers authority with a recovery code after 48 hours.
// It is unauthenticated because the recovering client has no token yet; the
// statement and state signatures are the authorization. Every lookup must
// prove possession of a key already bound to the account: the recovery key
// named in the request, or, when polling by recovery_id, the new authority
// device key in the pending row.
service RecoveryService {
  // A short-lived server challenge that GetRecoveryContext signatures cover.
  rpc GetRecoveryChallenge(GetRecoveryChallengeRequest) returns (GetRecoveryChallengeResponse);
  rpc GetRecoveryContext(GetRecoveryContextRequest) returns (GetRecoveryContextResponse);
  rpc SubmitRecovery(SubmitRecoveryRequest) returns (SubmitRecoveryResponse);
  rpc CompleteRecovery(CompleteRecoveryRequest) returns (CompleteRecoveryResponse);
}

message GetRecoveryChallengeRequest {}
message GetRecoveryChallengeResponse {
  // 32 bytes: the first 8 are the expiry time, the rest a server MAC.
  bytes challenge = 1;
}

message GetRecoveryContextRequest {
  // The current recovery public key. Unset when polling by recovery_id.
  bytes recovery_ed = 1;
  // Optional: poll after SubmitRecovery, signed by the new device key.
  string recovery_id = 2;
  // From GetRecoveryChallenge.
  bytes challenge = 3;
  // Ed25519 over "ra3/recovery-context\0" followed by the 32-byte challenge,
  // the 32-byte recovery_ed (zeros when empty), and the recovery_id bytes,
  // by recovery_ed's private key or by the pending recovery's new device key.
  bytes signature = 4;
}
message GetRecoveryContextResponse {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_PENDING = 1;
    PHASE_READY = 2;
    PHASE_REJECTED = 3;
    PHASE_PUBLISHED = 4;
  }
  string account_id = 1;
  repeated SecurityState states = 2; // genesis to current head
  Phase phase = 3;
  uint64 ready_ms = 4;
  string recovery_id = 5;
  // The account's Ed25519 public key. The recovered client needs it to
  // register later devices; the root key is never sent.
  bytes account_public_key = 6;
}

message SubmitRecoveryRequest {
  bytes statement = 1; // canonical RecoveryStatement
  bytes state = 2;     // exact new state bound by statement.StateHash
}
message SubmitRecoveryResponse {
  string recovery_id = 1;
  uint64 ready_ms = 2;
}

message CompleteRecoveryRequest {
  string recovery_id = 1;
  // By the new authority member Ed over "ra3/recovery-complete\0" ||
  // recovery_id. A retry after completion is answered without a token; the
  // device logs in with the normal challenge.
  bytes signature = 2;
}
message CompleteRecoveryResponse {
  string device_id = 1;
  // The account's Ed25519 public key, for pairing after recovery.
  bytes account_public_key = 2;
}

message NotifyRequest {
  string session_id = 1;
  NotifyKind kind = 2;
  // NOTIFY envelope, sealed with the notify key. The server passes it to
  // FCM targets as it is; Web Push only ever gets generic text.
  Envelope content = 3;
  // Notifications with the same key are sent once, e.g. one per approval.
  // Without a key they are coalesced per session and kind.
  string dedupe_key = 4;
}

enum PushType {
  PUSH_TYPE_UNSPECIFIED = 0;
  // A Web Push subscription as JSON.
  PUSH_TYPE_WEB_PUSH = 1;
  // A Firebase Cloud Messaging registration token.
  PUSH_TYPE_FCM = 2;
}

message SetPushTargetRequest {
  PushType type = 1;
  // Empty removes this device's target of this type.
  string target = 2;
  // Kinds of notifications to send.
  repeated NotifyKind kinds = 3;
}

message SetPushTargetResponse {
  // False when the server cannot send this type, e.g. FCM is not
  // configured; the target is kept for when it is.
  bool enabled = 1;
}

message NotifyResponse {}

message GetImageRequest {
  string session_id = 1;
  string image_id = 2;
}

message GetImageResponse {
  // IMAGE envelope; absent when expired.
  Envelope image = 1;
  // The image was stored but its retention ran out; only the preview in
  // the event is left. An image never stored fails with "not_found".
  bool expired = 2;
  // Unix milliseconds when the server deletes the image.
  int64 expires_ms = 3;
}

message PutImageRequest {
  string session_id = 1;
  string image_id = 2;
  // IMAGE envelope, at most 1 MiB.
  Envelope image = 3;
}

message PutImageResponse {
  // Unix milliseconds when the server deletes the image.
  int64 expires_ms = 1;
}

message Device {
  string id = 1;
  DeviceKind kind = 2;
  int64 created_ms = 3;
  // DEVICE_META envelope for a client, absent until one names it.
  Envelope meta = 4;
  // Revision of meta, 0 without one.
  uint64 meta_revision = 5;
  // When a client's stream last connected or closed, the current time
  // while one is connected; 0 for a client that has not connected since
  // the server began recording it, and for a machine, which has
  // Machine.last_seen_ms.
  int64 last_seen_ms = 6;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
  // The calling device.
  string current_device_id = 2;
}

message PutDeviceMetaRequest {
  string device_id = 1;
  // The revision the change is based on, 0 for a device without
  // metadata. The envelope's header seq must be this plus one.
  uint64 expected_revision = 2;
  // DEVICE_META envelope.
  Envelope meta = 3;
}

message PutDeviceMetaResponse {
  // False when the stored revision was not the expected one; device is
  // then what is stored, for the client to redo its change on. A retry
  // of a write that went through (same envelope) counts as applied.
  bool applied = 1;
  Device device = 2;
}

// AccountPrefsObject is a sealed account preferences object. The server
// sees only its ID, revision and size.
message AccountPrefsObject {
  // "project-prefs" holds a ProjectPrefs.
  string object_id = 1;
  // 0 while the object does not exist.
  uint64 revision = 2;
  // ACCOUNT_PREFS envelope; absent at revision 0.
  Envelope envelope = 3;
  int64 updated_ms = 4;
}

message GetAccountPrefsRequest {
  string object_id = 1;
}

message GetAccountPrefsResponse {
  AccountPrefsObject object = 1;
}

message PutAccountPrefsRequest {
  string object_id = 1;
  // The revision the change is based on, 0 to create the object. The
  // envelope's header seq must be this plus one.
  uint64 expected_revision = 2;
  Envelope envelope = 3;
}

message PutAccountPrefsResponse {
  // False when the stored revision was not the expected one; object is
  // then what is stored, and the client redoes its operation (pin, hide,
  // restore; never a toggle) on it. A retry of a write that went through
  // (same envelope) counts as applied.
  bool applied = 1;
  AccountPrefsObject object = 2;
}

// AccountPrefsUpdated is pushed to clients after an object changed.
message AccountPrefsUpdated {
  AccountPrefsObject object = 1;
}

// DeviceUpdated is pushed to clients when a device registers or its
// metadata changes.
message DeviceUpdated {
  Device device = 1;
}

// DeviceRemoved is pushed to clients when a device was removed.
message DeviceRemoved {
  string device_id = 1;
}

// Only the current authority may explicitly delete a computer archive.
message DeleteMachineRecordsRequest { string machine_id = 1; }
message DeleteMachineRecordsResponse {}
