syntax = "proto3";

package remoteagent.v1;

// Envelope is the unit of end-to-end encrypted data. The server stores and
// forwards envelopes but never holds a key that opens them.
message Envelope {
  // Serialized Header. It is the AES-GCM additional data exactly as
  // transmitted: receivers authenticate these bytes and decode them, they
  // never re-encode the header.
  bytes header = 1;
  // 12 random bytes.
  bytes nonce = 2;
  // AES-256-GCM ciphertext followed by the 16-byte tag.
  bytes ciphertext = 3;
  // Ed25519 signature by the sending device's key, so that a daemon can
  // tell which device sent a command even though the server is not
  // trusted. Clients set it on COMMAND envelopes, where a daemon requires
  // it; it is empty elsewhere. It signs the bytes as transmitted:
  //   "remote-agent/v1/envelope-signature\x00"
  //   || uint32be(len(header)) || header
  //   || uint32be(len(nonce)) || nonce
  //   || uint32be(len(ciphertext)) || ciphertext
  // (see internal/e2e SignEnvelope and testdata/v2-vectors.json). The
  // header's sender must be the ID of the signing device.
  bytes signature = 4;
}

// PayloadKind says what an envelope holds and which key seals it.
enum PayloadKind {
  PAYLOAD_KIND_UNSPECIFIED = 0;
  // An Event, sealed with the session key.
  PAYLOAD_KIND_EVENT = 1;
  // A Session describing the session, sealed with the session key.
  PAYLOAD_KIND_SESSION_META = 2;
  // The raw 32-byte session key, sealed with the wrap key.
  PAYLOAD_KIND_SESSION_KEY = 3;
  // A MachineMeta, sealed with the meta key.
  PAYLOAD_KIND_MACHINE_META = 4;
  // A Command from a client to a daemon, sealed with the command key.
  PAYLOAD_KIND_COMMAND = 5;
  // The daemon's CommandResult, sealed with the command key.
  PAYLOAD_KIND_COMMAND_RESULT = 6;
  // TerminalFrames of a terminal stream, sealed with the session key; the
  // header's request_id is the stream ID and seq counts the frames each
  // side sends.
  PAYLOAD_KIND_TERMINAL_OUTPUT = 7;
  PAYLOAD_KIND_TERMINAL_INPUT = 8;
  // A PairingPayload, sealed with the key both pairing devices derived;
  // the header's request_id is the pairing ID.
  PAYLOAD_KIND_PAIRING = 9;
  // A NotifyContent a daemon sends with Notify for the Android app, sealed
  // with the notify key; the header's request_id is the notification's
  // dedupe key.
  PAYLOAD_KIND_NOTIFY = 10;
  // An ImagePayload, the display copy of an image in a session, sealed
  // with the session key; the header's request_id is the image ID.
  PAYLOAD_KIND_IMAGE = 11;
  // An account preferences object (ProjectPrefs), sealed with the
  // account-prefs key; the header's request_id is the object ID and seq
  // its revision.
  PAYLOAD_KIND_ACCOUNT_PREFS = 12;
  // A DeviceMeta describing a client device, sealed with the device-meta
  // key; the header's request_id is the ID of the device described and
  // seq the metadata's revision.
  PAYLOAD_KIND_DEVICE_META = 13;
}

// Compression says how an envelope's plaintext was packed before it was
// sealed. Ciphertext does not compress, so what is to be saved in transit
// and on the server has to be saved here.
enum Compression {
  COMPRESSION_NONE = 0;
  // Raw DEFLATE (RFC 1951), no zlib or gzip wrapper.
  COMPRESSION_DEFLATE = 1;
}

// Header binds an envelope to its place. The receiver checks every field
// against where the envelope was found, so the server cannot move an
// envelope to another machine, session, position or request.
message Header {
  // Protocol version of the envelope format, currently 1.
  uint32 version = 1;
  PayloadKind kind = 2;
  string machine_id = 3;
  string session_id = 4;
  // Event sequence number for EVENT; revision for SESSION_META and
  // MACHINE_META, so that an older copy is never shown over a newer one;
  // the new revision for ACCOUNT_PREFS and DEVICE_META (the expected
  // revision plus one), so that the server cannot pass a copy off as
  // another revision.
  uint64 seq = 5;
  // Client-chosen ID for COMMAND and COMMAND_RESULT; the image ID for
  // IMAGE; the object ID for ACCOUNT_PREFS; the described device's ID for
  // DEVICE_META.
  string request_id = 6;
  // Unix milliseconds after which a COMMAND must not run.
  int64 deadline_ms = 7;
  // Device ID of the sender.
  string sender = 8;
  // How the plaintext was packed before sealing. A sender packs a payload
  // when that makes it smaller; session keys, images and pairing payloads
  // are never packed. A receiver unpacks before reading, refuses a
  // compression it does not know, and refuses a payload that unpacks to
  // more than 64 MiB.
  Compression compression = 9;
}
