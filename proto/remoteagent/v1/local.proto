syntax = "proto3";

package remoteagent.v1;

import "google/protobuf/timestamp.proto";
import "remoteagent/v1/event.proto";

// LocalService is served by the daemon on a unix socket. The local CLI and
// the Codex hooks use it; in P1 the same session operations are reached
// from clients through the server.
service LocalService {
  // Schedule manages daemon-owned tasks. It is also used by the local MCP.
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc Send(SendRequest) returns (SendResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  // ResumeSession starts the CLI again for an exited session, continuing its
  // conversation.
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  // ForkSession starts a new session that carries on from a session's
  // conversation as it is now, with the CLI's own fork. The source is left
  // as it is.
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);
  // CancelInput withdraws a message the model has not received: one still
  // in the daemon's queue, or (Claude Code) one held in the CLI's own queue
  // until the current tool call ends (InputStatus HELD_BY_CLI).
  rpc CancelInput(CancelInputRequest) returns (CancelInputResponse);
  // ResumeInput sends a message that was paused when its turn was
  // interrupted (InputState.paused), as a steer.
  rpc ResumeInput(ResumeInputRequest) returns (ResumeInputResponse);
  // SetModel switches the model and effort for this session only.
  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc SetApprovalMode(SetApprovalModeRequest) returns (SetApprovalModeResponse);
  // RenameSession gives a session a title of the user's choosing.
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  // Compact runs /compact while the session is idle.
  rpc Compact(CompactRequest) returns (CompactResponse);
  // AnswerPlan answers the CLI's prompt about a proposed plan: Codex's
  // "Implement this plan?", Claude Code's "Would you like to proceed?".
  rpc AnswerPlan(AnswerPlanRequest) returns (AnswerPlanResponse);
  // ListDirectories lists the folders in a directory, for choosing where
  // to start a session.
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // Image upload: a client sends each image to the machine in chunks,
  // before the Send or CreateSession that uses it. These are machine
  // commands (no session). A transfer belongs to the device that began it.
  rpc BeginImageUpload(BeginImageUploadRequest) returns (BeginImageUploadResponse);
  rpc PutImageChunk(PutImageChunkRequest) returns (PutImageChunkResponse);
  rpc GetImageUploadStatus(GetImageUploadStatusRequest) returns (GetImageUploadStatusResponse);
  rpc CompleteImageUpload(CompleteImageUploadRequest) returns (CompleteImageUploadResponse);
  rpc AbortImageUpload(AbortImageUploadRequest) returns (AbortImageUploadResponse);
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
  // Hook is called by `remote-agent hook codex|claude`. For PermissionRequest it
  // blocks until the request is decided.
  rpc Hook(HookRequest) returns (HookResponse);
}

message Session {
  string id = 1;
  string cwd = 2;
  string tmux_session = 3;
  SessionStatus status = 4;
  string status_detail = 5;
  // The CLI's own session ID and transcript (Codex's rollout); the names
  // date from when only Codex was supported.
  string codex_session_id = 6;
  string rollout_path = 7;
  google.protobuf.Timestamp created_at = 8;
  uint64 last_seq = 9;
  string model = 10;
  string effort = 11;
  int32 pending_approvals = 12;
  int32 pending_questions = 13;
  int32 queued_inputs = 14;
  // The title the user gave the session, else the first clause of the
  // first user message, shortened.
  string title = 15;
  // What happened last: the latest agent message or tool call, shortened.
  string preview = 16;
  // Approval settings from the latest turn context.
  string approvals_reviewer = 17;
  string approval_policy = 18;
  string sandbox = 19;
  string collaboration_mode = 20;
  // Context window use from the latest token count, 0 when unknown.
  int64 context_tokens = 21;
  int64 context_window = 22;
  // Codex is asking whether to implement the plan it proposed.
  bool plan_open = 23;
  // Why queued input waits: "draft" (the terminal holds unsent text),
  // "popup", or "unrecognized" (the input box cannot be found, likely
  // after a Codex update); empty when nothing waits or it is being sent.
  string input_wait = 24;
  Agent agent = 25;
  // The approval mode the session is in, for either CLI; UNSPECIFIED when
  // it is in none of the four, e.g. Claude Code's accept edits (see
  // permission_mode).
  ApprovalMode mode = 26;
  // Claude Code's permission mode as the CLI names it, e.g. "acceptEdits".
  string permission_mode = 27;
  // FULL_ACCESS cannot be switched to: Claude Code only offers bypass to
  // sessions started with it allowed. Always false for Codex.
  bool full_access_unavailable = 28;
  // Start of the currently displayed wait, not relay upload time.
  google.protobuf.Timestamp attention_since = 29;
  // Actual session exit time, rebuilt from the encrypted event log.
  google.protobuf.Timestamp ended_at = 30;
  // The session this one was forked from, empty if it was not forked.
  string forked_from = 31;
  // Seq of the session's SessionForked event: the events before it are
  // copies of the source's. 0 if it was not forked.
  uint64 forked_seq = 32;
}

message CreateSessionRequest {
  string cwd = 1;
  // Extra arguments passed to codex unchanged.
  repeated string args = 2;
  // Environment for the Codex process, e.g. proxy variables of the caller.
  map<string, string> env = 3;
  // First message, sent once Codex is ready.
  string prompt = 4;
  // Model, effort and approval mode to start with; empty means the
  // daemon's defaults, then Codex's own configuration.
  string model = 5;
  string effort = 6;
  ApprovalMode mode = 7;
  // The CLI to start; unspecified means Codex.
  Agent agent = 8;
  // Images for the first message, IDs from CompleteImageUpload (at most
  // 6). The prompt may be empty when there are images.
  repeated string image_ids = 9;
  reserved 10;
  // Claude Code only: hold the session to the standard context window
  // instead of the 1M one its models otherwise get.
  bool standard_context = 11;
}

message CreateSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  bool include_exited = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  // Full ID or a unique prefix.
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message SendRequest {
  string session_id = 1;
  // May be empty when image_ids are given.
  string text = 2;
  // Stable ID chosen by the caller; retries with the same ID are not sent twice.
  string request_id = 3;
  // Images to paste before the text, in order: IDs from
  // CompleteImageUpload by the same device, at most 6. Each is pasted into
  // the input box and must turn into "[Image #N]" before the text and
  // Enter are written; if one does not, nothing is submitted (the message
  // ends FAILED or NEEDS_TERMINAL). Needs MachineCapabilities.image_upload.
  repeated string image_ids = 4;
  // When a turn is running: steer (the default) writes the message as soon
  // as the input box is free, into the current turn; queue holds it until
  // the turn ends. The same while idle. Needs MachineCapabilities.send_modes.
  SendMode mode = 5;
}

message SendResponse {
  // Position in the input queue when accepted, 0 if already submitted.
  int32 queue_position = 1;
}

message InterruptRequest {
  string session_id = 1;
}

message InterruptResponse {
  // False when no turn was running.
  bool interrupted = 1;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {}

message CancelInputRequest {
  string session_id = 1;
  string request_id = 2;
}

message CancelInputResponse {}

message ResumeInputRequest {
  string session_id = 1;
  string request_id = 2;
}

message ResumeInputResponse {}

message ResolveApprovalRequest {
  string session_id = 1;
  string approval_id = 2;
  bool allow = 3;
  // Optional reason shown to the model on deny.
  string message = 4;
  // With allow: also stop asking about requests like this one, as the
  // second option of the CLI's own prompt does (Codex: commands with this
  // prefix; Claude Code: this directory, or accept edits). The hook cannot
  // say this, so the daemon answers that prompt itself; when the prompt
  // has no such option it allows this request only, and ApprovalResolved
  // tells which happened. Needs MachineCapabilities.approval_always.
  bool always = 5;
}

message ResolveApprovalResponse {}

message AnswerQuestionRequest {
  string session_id = 1;
  string question_id = 2;
  // 1-based option number of the current question.
  int32 option = 3;
  // 0-based index of the question the option answers, for a call that asks
  // several. When set, the option is only entered while the terminal shows
  // that question.
  optional int32 question_index = 4;
  // 1-based option numbers for a multi_select question (Claude Code); when
  // set, option is ignored.
  repeated int32 options = 5;
}

message AnswerQuestionResponse {}

message WatchEventsRequest {
  string session_id = 1;
  // Only events with seq greater than this are sent.
  uint64 after_seq = 2;
  // Keep the stream open and send new events as they arrive.
  bool follow = 3;
}

message WatchEventsResponse {
  Event event = 1;
}

message HookRequest {
  // remote-agent session ID from the RA_SESSION environment variable.
  string session_id = 1;
  // Raw JSON payload the CLI wrote to the hook's stdin.
  bytes payload = 2;
}

message HookResponse {
  // JSON the hook must print to stdout; empty means print nothing.
  bytes output = 1;
}

message SetModelRequest {
  string session_id = 1;
  // Model slug from ListModels, e.g. "gpt-6-sol" or Claude Code's
  // "claude-sonnet-5-5".
  string model = 2;
  // "low", "medium", "high", "xhigh", "max" or "ultra" (Codex only). Empty
  // for models without effort levels, such as Claude Code's Haiku 4.5.
  string effort = 3;
}

message SetModelResponse {}

message ListModelsRequest {
  // Unspecified means Codex.
  Agent agent = 1;
}

message ModelInfo {
  string slug = 1;
  string display_name = 2;
  string description = 3;
  repeated string efforts = 4;
  string default_effort = 5;
  // Context window in tokens; 0 when unknown.
  int64 context_window = 6;
  // The CLI's auto approval mode is not offered with this model (Claude
  // Code: its model catalog says so). False when unknown, so an older
  // daemon leaves the mode on offer.
  bool auto_unavailable = 7;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
  // Model new sessions use unless told otherwise.
  string default_model = 2;
}

message SetApprovalModeRequest {
  string session_id = 1;
  ApprovalMode mode = 2;
}

message SetApprovalModeResponse {}

message RenameSessionRequest {
  string session_id = 1;
  // One line of at most 60 characters; empty goes back to the automatic
  // title.
  string title = 2;
}

message RenameSessionResponse {}

message CompactRequest {
  string session_id = 1;
}

message CompactResponse {}

enum PlanChoice {
  PLAN_CHOICE_UNSPECIFIED = 0;
  // Switch to Default mode (Claude Code: manual, "Yes, manually approve
  // edits") and start implementing.
  PLAN_CHOICE_IMPLEMENT = 1;
  // Start a fresh thread with the plan and implement it. Codex only;
  // Claude Code 2.1.284 has no such choice and the command fails.
  PLAN_CHOICE_CLEAR_AND_IMPLEMENT = 2;
  // Stay in Plan mode. Claude Code ends the turn (Esc).
  PLAN_CHOICE_KEEP_PLANNING = 3;
}

message AnswerPlanRequest {
  string session_id = 1;
  PlanChoice choice = 2;
}

message AnswerPlanResponse {}

message ListDirectoriesRequest {
  // Absolute path or one starting with "~"; empty means the home folder.
  string path = 1;
}

message ListDirectoriesResponse {
  // The listed directory, absolute.
  string path = 1;
  // Its parent, empty at the root.
  string parent = 2;
  string home = 3;
  // Names of the folders in it, hidden ones left out.
  repeated string dirs = 4;
}

// DaemonSettings are kept by the daemon in settings.json.
message DaemonSettings {
  // Permission requests nobody answers are denied after this long.
  int32 approval_timeout_seconds = 1;
  // Defaults for sessions started from a client.
  string default_model = 2;
  string default_effort = 3;
  ApprovalMode default_mode = 4;
  // Defaults for new Claude Code sessions; the fields above are Codex's.
  AgentDefaults claude = 5;
  // Zero retains the daemon's default. Limits cover files, not CLI history.
  int64 image_upload_quota_bytes = 6;
}

message AgentDefaults {
  string model = 1;
  string effort = 2;
  ApprovalMode mode = 3;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  DaemonSettings settings = 1;
  ImageStorageUsage image_storage = 2;
}

message UpdateSettingsRequest {
  DaemonSettings settings = 1;
  // Clear reclaimable images and caches; preserve queued/CLI-dependent originals.
  bool clean_images = 2;
}

message UpdateSettingsResponse {
  DaemonSettings settings = 1;
  ImageStorageUsage image_storage = 2;
}

message ResumeSessionRequest {
  string session_id = 1;
}

message ResumeSessionResponse {
  Session session = 1;
}

// ForkSessionRequest forks a session that is idle or has exited and in
// which a message was sent. The fork runs on the same machine, in the same
// folder, with the same CLI and the settings the source last ran with.
message ForkSessionRequest {
  string session_id = 1;
}

message ForkSessionResponse {
  // The new session.
  Session session = 1;
}

enum ImageUploadState {
  IMAGE_UPLOAD_STATE_UNSPECIFIED = 0;
  // Chunks are arriving; persisted_bytes says how many are on disk.
  IMAGE_UPLOAD_STATE_RECEIVING = 1;
  // All bytes arrived and were checked; image_id is ready to be sent.
  IMAGE_UPLOAD_STATE_COMPLETE = 2;
  // A message that uses the image was accepted.
  IMAGE_UPLOAD_STATE_USED = 3;
}

// ImageUploadStatus is the state of a transfer, returned by every upload
// call. Unknown or expired transfers fail with "not_found".
message ImageUploadStatus {
  string transfer_id = 1;
  ImageUploadState state = 2;
  // Bytes stored durably so far; the next chunk starts here.
  int64 persisted_bytes = 3;
  int64 total_bytes = 4;
  // Set once COMPLETE: the ID to name in SendRequest or
  // CreateSessionRequest.
  string image_id = 5;
  int32 width = 6;
  int32 height = 7;
  // Unix milliseconds when the daemon deletes the unfinished transfer (an
  // hour after its last chunk) or the unused image (24 hours after it
  // completed).
  int64 expires_ms = 8;
  // Most bytes one PutImageChunk may carry.
  int32 max_chunk_bytes = 9;
}

message BeginImageUploadRequest {
  // 128 random bits, hex, chosen by the client. Beginning the same
  // transfer again with the same parameters returns its status, so a
  // client that lost a reply can go on where the daemon is.
  string transfer_id = 1;
  // PNG, JPEG, WebP or GIF; the daemon checks the bytes are that format.
  ImageFormat format = 2;
  // At most MachineCapabilities.max_upload_bytes.
  int64 total_bytes = 3;
  // SHA-256 of the whole file, checked on completion.
  bytes sha256 = 4;
}

message BeginImageUploadResponse {
  ImageUploadStatus status = 1;
}

message PutImageChunkRequest {
  string transfer_id = 1;
  // Where data goes; at most persisted_bytes. Bytes the daemon already has
  // must be the same as before (a retried chunk), or the call fails.
  int64 offset = 2;
  bytes data = 3;
}

message PutImageChunkResponse {
  ImageUploadStatus status = 1;
}

message GetImageUploadStatusRequest {
  string transfer_id = 1;
}

message GetImageUploadStatusResponse {
  ImageUploadStatus status = 1;
}

// CompleteImageUploadRequest checks the length, hash and format and that
// the image decodes, then makes it ready to send. Completing again returns
// the same image ID.
message CompleteImageUploadRequest {
  string transfer_id = 1;
}

message CompleteImageUploadResponse {
  ImageUploadStatus status = 1;
}

message AbortImageUploadRequest {
  string transfer_id = 1;
}

message AbortImageUploadResponse {}

// Collected locally and sealed with the settings reply; the server sees no usage.
message ImageStorageUsage {
  int64 upload_bytes = 1;
  int64 reserved_bytes = 2;
  int64 protected_bytes = 3;
  int64 reclaimable_bytes = 4;
  int64 cache_bytes = 5;
  repeated ImageSessionStorage sessions = 6;
}
message ImageSessionStorage {
  string session_id = 1;
  int64 bytes = 2;
  int64 protected_bytes = 3;
}

// Schedule carries the versioned JSON task model in internal/schedule.
// Keeping the same model for MCP, CLI and encrypted client commands avoids
// treating an Agent's private scheduler as the source of truth.
message ScheduleRequest {
  // create, list, get, update, pause, resume, cancel, run.
  string operation = 1;
  string task_id = 2;
  // Context for resolving "current" and after_turn; empty for machine callers.
  string session_id = 3;
  // UTF-8 JSON TaskSpec for create/update (complete replacement).
  bytes spec_json = 4;
  // Optional optimistic concurrency check; zero omits it.
  uint64 expected_revision = 5;
  // Optional stable creation key. Reusing it with a different spec fails.
  string request_id = 6;
}
message ScheduleResponse {
  // UTF-8 JSON Task, or {"tasks":[Task,...]} for list. Includes execution history.
  bytes result_json = 1;
}
