syntax = "proto3";

package remoteagent.v1;

import "google/protobuf/timestamp.proto";
import "remoteagent/v1/event.proto";

// LocalService is served by the daemon on a unix socket. The local CLI and
// the Codex hooks use it; in P1 the same session operations are reached
// from clients through the server.
service LocalService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc Send(SendRequest) returns (SendResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  // ResumeSession starts Codex again for an exited session, continuing its
  // conversation.
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  // CancelInput removes a queued message that has not been written yet.
  rpc CancelInput(CancelInputRequest) returns (CancelInputResponse);
  // SetModel switches the model and effort for this session only.
  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc SetApprovalMode(SetApprovalModeRequest) returns (SetApprovalModeResponse);
  // Compact runs /compact while the session is idle.
  rpc Compact(CompactRequest) returns (CompactResponse);
  // AnswerPlan answers Codex's "Implement this plan?" prompt.
  rpc AnswerPlan(AnswerPlanRequest) returns (AnswerPlanResponse);
  // ListDirectories lists the folders in a directory, for choosing where
  // to start a session.
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
  // Hook is called by `remote-agent hook codex`. For PermissionRequest it
  // blocks until the request is decided.
  rpc Hook(HookRequest) returns (HookResponse);
}

message Session {
  string id = 1;
  string cwd = 2;
  string tmux_session = 3;
  SessionStatus status = 4;
  string status_detail = 5;
  string codex_session_id = 6;
  string rollout_path = 7;
  google.protobuf.Timestamp created_at = 8;
  uint64 last_seq = 9;
  string model = 10;
  string effort = 11;
  int32 pending_approvals = 12;
  int32 pending_questions = 13;
  int32 queued_inputs = 14;
  // First line of the first user message, shortened.
  string title = 15;
  // What happened last: the latest agent message or tool call, shortened.
  string preview = 16;
  // Approval settings from the latest turn context.
  string approvals_reviewer = 17;
  string approval_policy = 18;
  string sandbox = 19;
  string collaboration_mode = 20;
  // Context window use from the latest token count, 0 when unknown.
  int64 context_tokens = 21;
  int64 context_window = 22;
  // Codex is asking whether to implement the plan it proposed.
  bool plan_open = 23;
  // Why queued input waits: "draft" (the terminal holds unsent text),
  // "popup", or "unrecognized" (the input box cannot be found, likely
  // after a Codex update); empty when nothing waits or it is being sent.
  string input_wait = 24;
  Agent agent = 25;
}

message CreateSessionRequest {
  string cwd = 1;
  // Extra arguments passed to codex unchanged.
  repeated string args = 2;
  // Environment for the Codex process, e.g. proxy variables of the caller.
  map<string, string> env = 3;
  // First message, sent once Codex is ready.
  string prompt = 4;
  // Model, effort and approval mode to start with; empty means the
  // daemon's defaults, then Codex's own configuration.
  string model = 5;
  string effort = 6;
  ApprovalMode mode = 7;
  // The CLI to start; unspecified means Codex.
  Agent agent = 8;
}

message CreateSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  bool include_exited = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  // Full ID or a unique prefix.
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message SendRequest {
  string session_id = 1;
  string text = 2;
  // Stable ID chosen by the caller; retries with the same ID are not sent twice.
  string request_id = 3;
}

message SendResponse {
  // Position in the input queue when accepted, 0 if already submitted.
  int32 queue_position = 1;
}

message InterruptRequest {
  string session_id = 1;
}

message InterruptResponse {
  // False when no turn was running.
  bool interrupted = 1;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {}

message CancelInputRequest {
  string session_id = 1;
  string request_id = 2;
}

message CancelInputResponse {}

message ResolveApprovalRequest {
  string session_id = 1;
  string approval_id = 2;
  bool allow = 3;
  // Optional reason shown to the model on deny.
  string message = 4;
}

message ResolveApprovalResponse {}

message AnswerQuestionRequest {
  string session_id = 1;
  string question_id = 2;
  // 1-based option number of the current question.
  int32 option = 3;
  // 0-based index of the question the option answers, for a call that asks
  // several. When set, the option is only entered while the terminal shows
  // that question.
  optional int32 question_index = 4;
}

message AnswerQuestionResponse {}

message WatchEventsRequest {
  string session_id = 1;
  // Only events with seq greater than this are sent.
  uint64 after_seq = 2;
  // Keep the stream open and send new events as they arrive.
  bool follow = 3;
}

message WatchEventsResponse {
  Event event = 1;
}

message HookRequest {
  // remote-agent session ID from the RA_SESSION environment variable.
  string session_id = 1;
  // Raw JSON payload Codex wrote to the hook's stdin.
  bytes payload = 2;
}

message HookResponse {
  // JSON the hook must print to stdout; empty means print nothing.
  bytes output = 1;
}

message SetModelRequest {
  string session_id = 1;
  // Model slug, e.g. "gpt-6-sol".
  string model = 2;
  // "low", "medium", "high", "xhigh", "max" or "ultra".
  string effort = 3;
}

message SetModelResponse {}

message ListModelsRequest {
  // Unspecified means Codex.
  Agent agent = 1;
}

message ModelInfo {
  string slug = 1;
  string display_name = 2;
  string description = 3;
  repeated string efforts = 4;
  string default_effort = 5;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
  // Model new sessions use unless told otherwise.
  string default_model = 2;
}

message SetApprovalModeRequest {
  string session_id = 1;
  ApprovalMode mode = 2;
}

message SetApprovalModeResponse {}

message CompactRequest {
  string session_id = 1;
}

message CompactResponse {}

enum PlanChoice {
  PLAN_CHOICE_UNSPECIFIED = 0;
  // Switch to Default mode and start implementing.
  PLAN_CHOICE_IMPLEMENT = 1;
  // Start a fresh thread with the plan and implement it.
  PLAN_CHOICE_CLEAR_AND_IMPLEMENT = 2;
  // Stay in Plan mode.
  PLAN_CHOICE_KEEP_PLANNING = 3;
}

message AnswerPlanRequest {
  string session_id = 1;
  PlanChoice choice = 2;
}

message AnswerPlanResponse {}

message ListDirectoriesRequest {
  // Absolute path or one starting with "~"; empty means the home folder.
  string path = 1;
}

message ListDirectoriesResponse {
  // The listed directory, absolute.
  string path = 1;
  // Its parent, empty at the root.
  string parent = 2;
  string home = 3;
  // Names of the folders in it, hidden ones left out.
  repeated string dirs = 4;
}

// DaemonSettings are kept by the daemon in settings.json.
message DaemonSettings {
  // Permission requests nobody answers are denied after this long.
  int32 approval_timeout_seconds = 1;
  // Defaults for sessions started from a client.
  string default_model = 2;
  string default_effort = 3;
  ApprovalMode default_mode = 4;
  // Defaults for new Claude Code sessions; the fields above are Codex's.
  AgentDefaults claude = 5;
}

message AgentDefaults {
  string model = 1;
  string effort = 2;
  ApprovalMode mode = 3;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  DaemonSettings settings = 1;
}

message UpdateSettingsRequest {
  DaemonSettings settings = 1;
}

message UpdateSettingsResponse {
  DaemonSettings settings = 1;
}

message ResumeSessionRequest {
  string session_id = 1;
}

message ResumeSessionResponse {
  Session session = 1;
}
