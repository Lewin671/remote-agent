syntax = "proto3";

package remoteagent.v1;

import "google/protobuf/timestamp.proto";

// Event is one entry in a session's unified event stream. It is the content
// that P1 will encrypt as the inner layer, so it may carry message text but
// must never be exposed to the server in plaintext.
message Event {
  // Per-session sequence number, starting at 1, contiguous and never reused.
  uint64 seq = 1;
  string session_id = 2;
  google.protobuf.Timestamp time = 3;
  // Codex turn the event belongs to, if any.
  string turn_id = 4;
  // Who caused the event, when the daemon knows: set on InputState,
  // UserMessage, ApprovalResolved, QuestionAnswered, PlanAnswered,
  // SettingsChanged and an interrupted TurnEnded. Absent when unknown.
  Origin origin = 5;

  oneof kind {
    UserMessage user_message = 10;
    AgentMessage agent_message = 11;
    Reasoning reasoning = 12;
    ToolCall tool_call = 13;
    TurnStarted turn_started = 14;
    TurnEnded turn_ended = 15;
    TokenUsage token_usage = 16;
    TurnContext turn_context = 17;
    ApprovalRequested approval_requested = 18;
    ApprovalResolved approval_resolved = 19;
    QuestionAsked question_asked = 20;
    QuestionAnswered question_answered = 21;
    SessionState session_state = 22;
    InputState input_state = 23;
    PlanProposed plan_proposed = 24;
    SettingsChanged settings_changed = 25;
    ToolStarted tool_started = 26;
    ImageGenerated image_generated = 27;
    PlanAnswered plan_answered = 28;
    SessionForked session_forked = 29;
  }
}

// OriginKind says where an action came from.
enum OriginKind {
  ORIGIN_KIND_UNSPECIFIED = 0;
  // A client device whose command carried a valid signature by its
  // device key, registered with the account key (Envelope.signature).
  // device_id names it.
  ORIGIN_KIND_CLIENT = 1;
  reserved 2;
  // The computer: typed in the local terminal, or sent with the local
  // remote-agent command.
  ORIGIN_KIND_LOCAL = 3;
  // The CLI or the daemon on its own, e.g. Claude Code answering a
  // finished background task, or an approval timing out.
  ORIGIN_KIND_SYSTEM = 4;
}

// Origin is the source of an action. A client shows a device by name only
// for ORIGIN_KIND_CLIENT, resolving device_id through ListDevices; a device
// no longer listed shows as a short ID.
message Origin {
  OriginKind kind = 1;
  string device_id = 2;
  // The command's request ID, for ORIGIN_KIND_CLIENT and
  // ORIGIN_KIND_UNVERIFIED_CLIENT.
  string request_id = 3;
}

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_PNG = 1;
  IMAGE_FORMAT_JPEG = 2;
  IMAGE_FORMAT_WEBP = 3;
  IMAGE_FORMAT_GIF = 4;
}

// ImageSource says how an image entered the session.
enum ImageSource {
  IMAGE_SOURCE_UNSPECIFIED = 0;
  // Part of a user message: pasted in the terminal, or sent from a client
  // (then ImageRef.upload_id is set).
  IMAGE_SOURCE_USER = 1;
  // Returned by a tool the agent called: Claude Code's Read, Codex's
  // view_image, a browser screenshot.
  IMAGE_SOURCE_TOOL = 2;
  // Made by the agent (Codex image generation).
  IMAGE_SOURCE_GENERATED = 3;
}

// ImageSync says whether the image's display copy can be fetched with
// GetImage.
enum ImageSync {
  IMAGE_SYNC_UNSPECIFIED = 0;
  // The display copy was uploaded before this event. GetImage may still
  // report it expired later.
  IMAGE_SYNC_SYNCED = 1;
  // No display copy: it could not be made or uploaded (too large, not
  // decodable, account quota full, upload kept failing). The preview is
  // all there is; the original stays in the CLI's record on the computer.
  IMAGE_SYNC_PREVIEW_ONLY = 2;
  // Not even a preview: only what else the ref says (path, size) is known.
  IMAGE_SYNC_NAME_ONLY = 3;
}

// ImageRef is one appearance of an image in a session. The same picture
// appearing twice gets two refs that may share image_id (and so one
// display copy), each with its own index, path and source.
message ImageRef {
  // Random 128-bit hex ID, never derived from the content, under which the
  // display copy is stored (GetImage). Empty with IMAGE_SYNC_NAME_ONLY.
  string image_id = 1;
  ImageSource source = 2;
  ImageSync sync = 3;
  // N of the CLI's "[Image #N]" placeholder in the message text, 0 if the
  // image has none (tool results, generated images).
  int32 cli_index = 4;
  // Where the image is on the computer, if the CLI recorded it: the file a
  // tool read, a pasted file, a generated image's saved copy.
  string path = 5;
  // Format and pixel size of the image as the CLI recorded it; bytes is
  // its encoded size.
  ImageFormat format = 6;
  int32 width = 7;
  int32 height = 8;
  int64 bytes = 9;
  // The size of the picture before the CLI shrank it, when the CLI says
  // (Claude Code does for Read); 0 when unknown or the same as width and
  // height.
  int32 original_width = 10;
  int32 original_height = 11;
  // Size of the display copy (long side at most 2048), 0 without one.
  int32 display_width = 12;
  int32 display_height = 13;
  // Preview (long side at most 320) embedded in the event, so a list can
  // draw it without fetching anything; JPEG, or PNG when transparent.
  // Empty with IMAGE_SYNC_NAME_ONLY and when an oversized event had to
  // drop it.
  bytes preview = 14;
  ImageFormat preview_format = 15;
  int32 preview_width = 16;
  int32 preview_height = 17;
  // For an image sent from a client: the image ID CompleteImageUpload
  // returned, so the sender can match its local thumbnail.
  string upload_id = 18;
}

// ImageGenerated is an image the agent made (Codex's image generation).
message ImageGenerated {
  // The CLI's ID for the generation call.
  string call_id = 1;
  // The prompt as the CLI rewrote it, if recorded.
  string revised_prompt = 2;
  repeated ImageRef images = 3;
}

// SessionForked is where a forked session leaves its source: the events
// before it are copies of the source's, made when it was forked, and those
// after it are the fork's own. The event's origin says who forked it.
message SessionForked {
  string source_session_id = 1;
  // The source's title then, for the line that says where the session
  // comes from.
  string source_title = 2;
}

// PlanAnswered records an answer to the CLI's plan prompt sent through
// remote-agent; the event's origin says by whom.
message PlanAnswered {
  // A PlanChoice value (local.proto).
  int32 choice = 1;
}

// ToolStarted says the model called a tool; its ToolCall event with the
// same call_id follows when the call completes. For
// Codex a call is one exec script: a second command it ran reports a
// ToolCall with the ID "<call_id>#2", which has no start of its own.
message ToolStarted {
  string title = 1;
  string call_id = 2;
  // What the ToolCall will carry, when known at the start (Claude Code).
  ToolKind kind = 3;
  string input = 4;
  // The CLI's tool name, e.g. "Bash".
  string item_type = 5;
  // See ToolCall.input_digest.
  string input_digest = 6;
}

// Agent is the CLI a session runs. Sessions recorded before Claude Code
// support carry AGENT_UNSPECIFIED and are Codex sessions.
enum Agent {
  AGENT_UNSPECIFIED = 0;
  AGENT_CODEX = 1;
  AGENT_CLAUDE = 2;
}

message UserMessage {
  // The message as the CLI recorded it, including the CLI's "[Image #N]"
  // placeholders; ImageRef.cli_index ties each to its image.
  string text = 1;
  reserved 2;
  repeated ImageRef images = 3;
  // The Send request that submitted this message, when the daemon matched
  // it; the event's origin says who sent it.
  string request_id = 4;
}

message AgentMessage {
  string text = 1;
  // "commentary" for progress updates, "final_answer" for the turn's answer.
  string phase = 2;
}

// Reasoning carries only the summary Codex writes to the rollout.
message Reasoning {
  string text = 1;
}

enum ToolKind {
  TOOL_KIND_UNSPECIFIED = 0;
  TOOL_KIND_COMMAND = 1;
  TOOL_KIND_FILE_CHANGE = 2;
  TOOL_KIND_MCP = 3;
  TOOL_KIND_WEB_SEARCH = 4;
  TOOL_KIND_OTHER = 5;
}

// ToolCall is a completed tool invocation together with its result.
message ToolCall {
  string call_id = 1;
  ToolKind kind = 2;
  // Short human-readable name, e.g. the command line or "server.tool".
  string title = 3;
  // Tool input, JSON or plain text.
  string input = 4;
  // Tool output, truncated to a bounded size.
  string output = 5;
  bool output_truncated = 6;
  // "completed", "failed", ...
  string status = 7;
  optional int32 exit_code = 8;
  int64 duration_ms = 9;
  // Original Codex item type, e.g. "CommandExecution".
  string item_type = 10;
  // Hex SHA-256 of the call's complete input (Claude Code: the command of
  // a shell call, else the input as compact JSON), however long; it ties
  // the call to its approval request.
  string input_digest = 11;
  // Images the call returned, e.g. a file Claude Code read or a screenshot.
  repeated ImageRef images = 12;
  // Set when the call went on in the background: this event is then its
  // start, not its completion, and no later event reliably says when it
  // ends (show "background, status unknown").
  ToolBackground background = 13;
  // The CLI's ID for the background work (Claude Code's task or agent
  // ID), when it gives one.
  string background_id = 14;
}

enum ToolBackground {
  // Not in the background: the call ended.
  TOOL_BACKGROUND_UNSPECIFIED = 0;
  // The model asked for it (Claude Code's run_in_background, an async
  // subagent).
  TOOL_BACKGROUND_REQUESTED = 1;
  // The CLI moved it to the background when it outran its timeout.
  TOOL_BACKGROUND_TIMED_OUT = 2;
  // The user moved it to the background in the terminal (Claude Code's
  // Ctrl+B).
  TOOL_BACKGROUND_BY_USER = 3;
  // The turn ended while it still ran (a Codex exec cell that yielded).
  TOOL_BACKGROUND_STILL_RUNNING = 4;
}

message TurnStarted {}

enum TurnOutcome {
  TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_COMPLETED = 1;
  TURN_OUTCOME_ABORTED = 2;
}

message TurnEnded {
  TurnOutcome outcome = 1;
  string reason = 2;
  int64 duration_ms = 3;
}

message TokenUsage {
  int64 input_tokens = 1;
  int64 cached_input_tokens = 2;
  int64 output_tokens = 3;
  int64 reasoning_output_tokens = 4;
  int64 total_tokens = 5;
  // Tokens in the context window after the last request.
  int64 last_total_tokens = 6;
  int64 context_window = 7;
  // Account usage limits Codex reported with the count.
  RateLimit primary_limit = 8;
  RateLimit secondary_limit = 9;
  string plan_type = 10;
  // The reply whose usage the count ends with (Claude Code writes a reply's
  // usage on each of its lines), so that a reply is counted once.
  string message_id = 11;
}

// RateLimit is one of the account's usage windows.
message RateLimit {
  double used_percent = 1;
  int64 window_minutes = 2;
  // Unix seconds when the window resets.
  int64 resets_at = 3;
}

// PlanProposed is a plan the CLI wrote in Plan mode (Claude Code: its
// ExitPlanMode call). The CLI then asks in the terminal whether to carry it
// out.
message PlanProposed {
  string text = 1;
  // Claude Code's ExitPlanMode call ID; empty for Codex.
  string call_id = 2;
}

// ApprovalMode is what a client can switch a session to. ASK, AUTO and
// FULL_ACCESS are Codex's /permissions levels and PLAN its Plan mode; for
// Claude Code they are manual, auto, bypass and plan.
enum ApprovalMode {
  APPROVAL_MODE_UNSPECIFIED = 0;
  APPROVAL_MODE_ASK = 1;
  APPROVAL_MODE_AUTO = 2;
  APPROVAL_MODE_FULL_ACCESS = 3;
  APPROVAL_MODE_PLAN = 4;
}

// SettingsChanged records a change made through remote-agent that Codex
// only writes to the rollout when the next turn starts.
message SettingsChanged {
  string model = 1;
  string effort = 2;
  ApprovalMode mode = 3;
  // Set when the context was compacted.
  bool compacted = 4;
}

// TurnContext is the configuration the CLI recorded at the start of a
// turn. Codex sets the approval fields 3 to 6; Claude Code sets
// permission_mode.
message TurnContext {
  // Codex's model slug, or Claude Code's full model ID (e.g.
  // "claude-haiku-4-5-20251001").
  string model = 1;
  string effort = 2;
  string approval_policy = 3;
  // "user" or "auto_review".
  string approvals_reviewer = 4;
  string sandbox = 5;
  string collaboration_mode = 6;
  // Claude Code's permission mode: "default" (manual), "acceptEdits",
  // "plan", "bypassPermissions" or "auto".
  string permission_mode = 7;
}

message ApprovalRequested {
  string approval_id = 1;
  string tool_name = 2;
  string description = 3;
  // Command line for shell tools.
  string command = 4;
  string tool_input_json = 5;
  google.protobuf.Timestamp deadline = 6;
  // The digest of the requested call's complete input, computed exactly as
  // ToolCall.input_digest (Claude Code), so a client matches the request
  // to its call by comparing the two strings; empty for Codex.
  string input_digest = 7;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_ALLOW = 1;
  APPROVAL_DECISION_DENY = 2;
  // Nobody answered before the deadline; the request was denied.
  APPROVAL_DECISION_TIMEOUT = 3;
  // The hook went away (Codex gave up on it) before a decision was made.
  APPROVAL_DECISION_CANCELED = 4;
  // Answered in the terminal before any client did (Claude Code shows its
  // own prompt while the hook waits); what was chosen shows in the tool
  // call that follows.
  APPROVAL_DECISION_TERMINAL = 5;
  // Allowed, and the CLI will not ask about requests like it again;
  // ApprovalResolved.message is the CLI's own wording of that option.
  APPROVAL_DECISION_ALLOW_ALWAYS = 6;
}

message ApprovalResolved {
  string approval_id = 1;
  ApprovalDecision decision = 2;
  string message = 3;
}

message QuestionOption {
  string label = 1;
  string description = 2;
}

message Question {
  // Codex's question ID; for Claude Code, which has none, the question
  // text, which also keys its answer.
  string id = 1;
  string header = 2;
  string text = 3;
  repeated QuestionOption options = 4;
  // Several options may be picked (Claude Code); answer with
  // AnswerQuestionRequest.options.
  bool multi_select = 5;
}

message QuestionAsked {
  // The CLI's tool call ID; also used to answer the question.
  string question_id = 1;
  repeated Question questions = 2;
  // request_user_input_async: the model does not wait for the answer.
  bool async = 3;
}

message QuestionAnswer {
  string question_id = 1;
  repeated string answers = 2;
}

message QuestionAnswered {
  string question_id = 1;
  repeated QuestionAnswer answers = 2;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_STARTING = 1;
  SESSION_STATUS_IDLE = 2;
  SESSION_STATUS_RUNNING = 3;
  // A popup in the terminal needs attention.
  SESSION_STATUS_BLOCKED = 4;
  SESSION_STATUS_EXITED = 5;
}

message SessionState {
  SessionStatus status = 1;
  // Popup title when blocked, exit reason when exited.
  string detail = 2;
  // The stable terminal screen is asking whether to implement a plan.
  bool plan_open = 3;
}

enum InputStatus {
  INPUT_STATUS_UNSPECIFIED = 0;
  // Accepted and waiting for the input box.
  INPUT_STATUS_QUEUED = 1;
  // Codex recorded the message.
  INPUT_STATUS_SUBMITTED = 2;
  // The keys were delivered but Codex did not record the message in time.
  // It is not sent again, to avoid submitting it twice. A record that
  // comes later still confirms it: SUBMITTED then follows, just before
  // the user message.
  INPUT_STATUS_UNCONFIRMED = 3;
  // Withdrawn before the model received it.
  INPUT_STATUS_CANCELED = 4;
  // Not submitted: something failed before Enter (e.g. the CLI did not
  // turn an image into "[Image #N]"), and the input box was verified to be
  // empty again. Nothing is retried automatically.
  INPUT_STATUS_FAILED = 5;
  // Not submitted, and remote-agent could not verify that the input box is
  // back to what it was: part of the message may still be in it. It is
  // neither submitted nor retried; the user sorts it out in the terminal.
  INPUT_STATUS_NEEDS_TERMINAL = 6;
  // Written, and the CLI holds it in its own queue until the current tool
  // call ends (Claude Code during a turn). It can still be canceled; it
  // turns SUBMITTED when the model receives it.
  INPUT_STATUS_HELD_BY_CLI = 7;
}

// SendMode is how a message sent during a turn is delivered.
enum SendMode {
  // Steer.
  SEND_MODE_UNSPECIFIED = 0;
  // Into the current turn as soon as the input box is free.
  SEND_MODE_STEER = 1;
  // After the current turn ends, in order.
  SEND_MODE_QUEUE = 2;
}

// InputStage is how far a queued message has got while it is written to
// the terminal. The daemon saves the stage before every write, so after a
// restart it knows what the terminal may hold.
enum InputStage {
  INPUT_STAGE_UNSPECIFIED = 0;
  // Waiting for the input box.
  INPUT_STAGE_WAITING = 1;
  // Pasting the image files one by one.
  INPUT_STAGE_PASTING_IMAGES = 2;
  // Every image shows as "[Image #N]" in the input box.
  INPUT_STAGE_IMAGES_RECOGNIZED = 3;
  // The text and Enter were written; waiting for the CLI to record it.
  INPUT_STAGE_SUBMITTING = 4;
}

// InputState tracks a message sent with Send. The text itself appears in
// the UserMessage event once Codex records it.
message InputState {
  string request_id = 1;
  InputStatus status = 2;
  // Why a message was CANCELED when the user did not cancel it: "exited",
  // the session ended before it was written. Empty for the user's own
  // cancel. For FAILED and NEEDS_TERMINAL a code: "image_not_recognized",
  // "input_changed" (the input box held something else), "timeout",
  // "restarted" (the daemon stopped while writing), "write_failed".
  string reason = 3;
  // With QUEUED, and on later updates while it is being written.
  InputStage stage = 4;
  // Set with the first QUEUED state: what was accepted, so that every
  // client can show the shared queue. image_ids are the upload IDs.
  string text = 5;
  repeated string image_ids = 6;
  // Set with the first QUEUED state.
  SendMode mode = 7;
  // With QUEUED: the turn was interrupted before this message was written,
  // so it waits for the user to send it (ResumeInput) or cancel it. Every
  // update of a paused message repeats it; a resumed one clears it.
  bool paused = 8;
}
