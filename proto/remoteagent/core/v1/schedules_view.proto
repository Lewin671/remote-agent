  SCHEDULE_TASK_STATUS_FAILED = 3;
  SCHEDULE_TASK_STATUS_UNCERTAIN = 4;
  SCHEDULE_TASK_STATUS_COMPLETED = 5;
  SCHEDULE_TASK_STATUS_CANCELLED = 6;
