syntax = "proto3";

package remoteagent.core.v1;

import "remoteagent/core/v1/home_view.proto";
import "remoteagent/core/v1/new_session_view.proto";
import "remoteagent/core/v1/text.proto";
import "remoteagent/v1/event.proto";

// --- Shared Enums ---

enum ScheduleDisplayGroup {
  SCHEDULE_DISPLAY_GROUP_UNSPECIFIED = 0;
  SCHEDULE_DISPLAY_GROUP_ATTENTION = 1;
