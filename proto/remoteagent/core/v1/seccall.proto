syntax = "proto3";

package remoteagent.core.v1;

import "remoteagent/v1/envelope.proto";
import "remoteagent/v1/local.proto";
import "remoteagent/v1/relay.proto";

// ---- Stateless SecCall API (for S6 authority/pair/recovery/store workflows & SW/Push notifications) ----

message SecPin {
  string account = 1;
  bytes domain = 2;
  bytes genesis = 3;
}

message SecMember {
  string id = 1;
  bytes ed_public = 2;
  bytes x_public = 3;
  uint32 kind = 4;
}

message SecGrant {
  string recipient = 1;
  bytes enc = 2;
  bytes cipher = 3;
}

message SecParsedState {
  bytes state_hash = 1;
  bytes core_hash = 2;
  string account = 3;
  bytes domain = 4;
  string authority_id = 5;
  bytes recovery_ed = 6;
  bytes parent = 7;
  uint64 epoch = 8;
  uint64 content_epoch = 9;
  uint64 issued_at = 10;
  repeated SecMember members = 11;
  repeated string removed = 12;
  repeated SecGrant grants = 13;
  bytes prev_secret = 14;
  bytes signature = 15;
  bytes signing_bytes = 16;
}

message SecParsedLease {
  bytes domain = 1;
  bytes head = 2;
  uint64 issued_at = 3;
  uint64 not_after = 4;
  bytes signature = 5;
  bytes signing_bytes = 6;
}

message SecParsedRecoveryStatement {
  string account = 1;
  bytes domain = 2;
  bytes parent = 3;
  string new_authority_id = 4;
  bytes new_recovery_ed = 5;
  SecMember new_member = 6;
  uint64 issued_at = 7;
  bytes state_hash = 8;
  bytes nonce = 9;
  bytes signature = 10;
  bytes signing_bytes = 11;
}

message SecKemPair {
  string member_id = 1;
  bytes enc = 2;
  bytes dh = 3;
}

message SecUnsignedState {
  SecParsedState parsed = 1;
  bytes unsigned_core = 2;
  repeated SecGrant grants = 3;
  bytes prev_secret = 4;
  bytes signing_bytes = 5;
  bytes state_hash = 6;
}

message SecParsedApproval {
  string account_id = 1;
  string pairing_id = 2;
  string approver_device_id = 3;
  bytes approver_public_key = 4;
  string candidate_device_id = 5;
  bytes candidate_device_public_key = 6;
  remoteagent.v1.DeviceKind candidate_kind = 7;
  int64 expires_ms = 8;
  bytes nonce = 9;
  string replaces_device_id = 10;
}

message SecCallRequest {
  oneof call {
    bytes parse_state = 1;
    SecVerifyChainCall verify_chain = 2;
    SecGrantChallengeCall grant_challenge = 3;
    SecOpenGrantWithDHCall open_grant_with_dh = 4;
    bytes parse_lease = 7;
    SecVerifyLeaseCall verify_lease = 8;
    SecNewLeaseUnsignedCall new_lease_unsigned = 9;
    SecMarshalLeaseCall marshal_lease = 10;
    bytes parse_recovery_statement = 11;
    SecVerifyRecoveryStatementCall verify_recovery_statement = 12;
    SecNewRecoveryStatementUnsignedCall new_recovery_statement_unsigned = 13;
    SecMarshalRecoveryStatementCall marshal_recovery_statement = 14;
    SecBuildStateCall build_state = 15;
    SecMarshalStateCall marshal_state = 22;
    SecOpenPrevSecretCall open_prev_secret = 24;
    SecVerifyPairApprovalCall verify_pair_approval = 25;
    SecMachineReplacementOriginsCall machine_replacement_origins = 26;
    SecPairTrustDescriptorCall pair_trust_descriptor = 27;
    bytes parse_pair_trust_descriptor = 28;
    SecPairDomainCommitCall pair_domain_commit = 29;
    SecPairTranscriptCall pair_transcript = 30;
    SecPairIdentityTranscriptCall pair_identity_transcript = 31;
    SecPairDomainTranscriptCall pair_domain_transcript = 32;
    SecDerivePairSecretsCall derive_pair_secrets = 33;
    bytes ed25519_seed_public = 34;
    SecEd25519SeedSignCall ed25519_seed_sign = 35;
    SecInflateBoundedCall inflate_bounded = 37;
    SecOpenNotifyEnvelopeCall open_notify_envelope = 40;
    SecDerivePurposeKeyCall derive_purpose_key = 41;
  }
}

message SecVerifyChainCall {
  SecPin pin = 1;
  repeated bytes states = 2;
  repeated bytes recovery_proofs = 3;
  bytes lease = 4;
  int64 now_ms = 5;
  string member_id = 6;
  bool check_lease_window = 7;
}

message SecGrantChallengeCall {
  SecPin pin = 1;
  bytes state = 2;
  string member_id = 3;
}

message SecOpenGrantWithDHCall {
  SecPin pin = 1;
  bytes state = 2;
  string member_id = 3;
  bytes dh = 4;
}

message SecVerifyLeaseCall {
  bytes lease = 1;
  bytes head_state = 2;
  int64 now_ms = 3;
  bool check_window = 4;
}

message SecNewLeaseUnsignedCall {
  bytes head_state = 1;
  uint64 now_ms = 2;
}

message SecMarshalLeaseCall {
  bytes domain = 1;
  bytes head = 2;
  uint64 issued_at = 3;
  uint64 not_after = 4;
  bytes signature = 5;
}

message SecVerifyRecoveryStatementCall {
  bytes statement = 1;
  bytes parent_state = 2;
  bytes next_state = 3;
}

message SecNewRecoveryStatementUnsignedCall {
  bytes parent_state = 1;
  bytes next_state = 2;
  bytes nonce = 3;
}

message SecMarshalRecoveryStatementCall {
  string account = 1;
  bytes domain = 2;
  bytes parent = 3;
  string new_authority_id = 4;
  bytes new_recovery_ed = 5;
  SecMember new_member = 6;
  uint64 issued_at = 7;
  bytes state_hash = 8;
  bytes nonce = 9;
  bytes signature = 10;
}

message SecBuildStateCall {
  uint32 kind = 1; // 1=Genesis, 2=Membership, 3=Pair, 4=Handoff, 5=Recovery, 6=RecoveryKeyRotation, 7=CustomState
  string account = 2;
  bytes domain = 3;
  bytes parent_state = 4;
  SecMember member = 5;
  repeated SecMember members = 6;
  repeated string removed = 7;
  string incoming_id = 8;
  bytes recovery_ed = 9;
  bytes secret = 10;
  bytes old_secret = 11;
  bytes prev_secret = 12;
  bytes prev_secret_nonce = 13;
  uint64 now_ms = 14;
  repeated SecKemPair kems = 15;
}

message SecMarshalStateCall {
  bytes unsigned_core = 1;
  repeated SecGrant grants = 2;
  bytes prev_secret = 3;
  bytes signature = 4;
}

message SecOpenPrevSecretCall {
  bytes new_secret = 1;
  bytes blob = 2;
}

message SecVerifyPairApprovalCall {
  bytes approval = 1;
  bytes signature = 2;
  string expected_account = 3;
  string expected_candidate_id = 4;
}

message SecMachineReplacementOriginsCall {
  string account = 1;
  string target_machine_id = 2;
  repeated bytes states = 3;
  repeated remoteagent.v1.MachineReplacementProof proofs = 4;
}

message SecPairTrustDescriptorCall {
  SecPin pin = 1;
  string approver = 2;
}

message SecPairDomainCommitCall {
  bytes initiator = 1;
  bytes trust_descriptor = 2;
}

message SecPairTranscriptCall {
  string pairing_id = 1;
  bytes initiator_public = 2;
  bytes joiner_public = 3;
  int32 joiner_kind = 4;
}

message SecPairIdentityTranscriptCall {
  string pairing_id = 1;
  bytes initiator_public = 2;
  bytes joiner_public = 3;
  bytes device_ed_public = 4;
  int32 joiner_kind = 5;
}

message SecPairDomainTranscriptCall {
  string pairing_id = 1;
  bytes initiator_public = 2;
  bytes joiner_public = 3;
  bytes device_ed_public = 4;
  bytes device_x_public = 5;
  int32 joiner_kind = 6;
  bytes trust_descriptor = 7;
}

message SecDerivePairSecretsCall {
  bytes shared = 1;
  bytes transcript = 2;
}

message SecEd25519SeedSignCall {
  bytes seed = 1;
  bytes message = 2;
}

message SecInflateBoundedCall {
  bytes compressed = 1;
  uint32 limit = 2;
}

message SecOpenNotifyEnvelopeCall {
  SecPin pin = 1;
  repeated bytes states = 2;
  repeated bytes recovery_proofs = 3;
  string member_id = 4;
  bytes dh = 5;
  bytes content_secret = 6;
  remoteagent.v1.Envelope envelope = 7;
  bytes purpose_key = 8;
}

message SecDerivePurposeKeyCall {
  bytes secret = 1;
  string account_id = 2;
  bytes domain = 3;
  uint64 content_epoch = 4;
  uint32 purpose = 5;
}

message SecCallResponse {
  string error = 1;
  string error_code = 2;
  SecParsedState parsed_state = 3;
  SecParsedLease parsed_lease = 4;
  SecParsedRecoveryStatement parsed_recovery = 5;
  SecUnsignedState unsigned_state = 6;
  SecParsedApproval parsed_approval = 7;
  bytes data = 8;
  bytes secondary_data = 9;
  string text = 10;
  repeated string strings = 11;
  SecPin pin = 12;
}
