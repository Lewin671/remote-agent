syntax = "proto3";

package remoteagent.core.v1;

import "remoteagent/core/v1/home_view.proto";
import "remoteagent/core/v1/machine_view.proto";
import "remoteagent/core/v1/new_session_view.proto";
import "remoteagent/core/v1/project_view.proto";
import "remoteagent/core/v1/settings_view.proto";
import "remoteagent/core/v1/session_view.proto";
import "remoteagent/core/v1/schedules_view.proto";
import "remoteagent/core/v1/sync_view.proto";
import "remoteagent/core/v1/transport.proto";
import "remoteagent/core/v1/usage_view.proto";
import "remoteagent/v1/event.proto";
import "remoteagent/v1/local.proto";
import "remoteagent/v1/relay.proto";
import "remoteagent/v1/remote.proto";

message HomeScreenRequest {
  int32 ended_limit = 1;
}

message ProjectScreenRequest {
  string project_key = 1;
  bool manage = 2;
  int32 ended_limit = 3;
  string machine_id = 4;
}

message NewSessionScreenRequest {
  string project_key = 1;
}

// Transitional screen request for SyncStateView (Step 3-4 migration bridge; delete afterward).
message SyncStateScreenRequest {}

// Transitional screen request for SessionDataView (Step 3 migration bridge; delete afterward).
message SessionDataScreenRequest {
  string session_id = 1;
}

message Screen {
  oneof screen {
    HomeScreenRequest home = 1;
    ProjectScreenRequest project = 2;
    NewSessionScreenRequest new_session = 3;
    // Transitional screen; delete after Steps 3-4 migrate remaining views into Core.
    SyncStateScreenRequest sync_state = 4;
    // Transitional screen; delete after Step 3 migrates the session view into Core.
    SessionDataScreenRequest session_data = 5;
    SettingsScreenRequest settings = 30;
    MachineStatusScreenRequest machine_status = 31;
    MachineSettingsScreenRequest machine_settings = 32;
    QuotaScreenRequest quota = 33;
    DevicesScreenRequest devices = 34;
    ClientDetailScreenRequest client_detail = 35;
    UsageScreenRequest usage = 36;
    DirectDiagnosticsScreenRequest direct_diagnostics = 37;
    SessionScreenRequest session = 10;
    SchedulesScreenRequest schedules = 20;
    ScheduleDetailScreenRequest schedule_detail = 21;
    ScheduleFormScreenRequest schedule_form = 22;
    ScheduleSessionStripScreenRequest schedule_session_strip = 23;
  }
}

message ViewModel {
  oneof view {
    HomeViewModel home = 1;
    ProjectViewModel project = 2;
    NewSessionViewModel new_session = 3;
    // Transitional view; delete after Steps 3-4 migrate remaining views into Core.
    SyncStateView sync_state = 4;
    // Transitional view; delete after Step 3 migrates the session view into Core.
    SessionDataView session_data = 5;
    SettingsViewModel settings = 30;
    MachineStatusViewModel machine_status = 31;
    MachineSettingsViewModel machine_settings = 32;
    QuotaViewModel quota = 33;
    DevicesViewModel devices = 34;
    ClientDetailViewModel client_detail = 35;
    UsageViewModel usage = 36;
    DirectDiagnosticsViewModel direct_diagnostics = 37;
    SessionViewModel session = 10;
    SchedulesViewModel schedules = 20;
    ScheduleDetailViewModel schedule_detail = 21;
    ScheduleFormViewModel schedule_form = 22;
    ScheduleSessionStripViewModel schedule_session_strip = 23;
  }
}

message MonthStart {
  int32 year = 1;
  int32 month = 2;
  int64 start_ms = 3;
}

message LocalCalendar {
  int64 now_ms = 1;
  int64 today_start_ms = 2;
  int64 yesterday_start_ms = 3;
  int64 week_start_ms = 4;
  int32 now_year = 5;
  repeated MonthStart months = 6;
}

message EntropyProvided {
  repeated string random_ids = 1;
  repeated double unit_floats = 2;
  bytes seed = 3;
}

enum SyncLifecycleKind {
  SYNC_LIFECYCLE_KIND_UNSPECIFIED = 0;
  SYNC_LIFECYCLE_KIND_START = 1;
  SYNC_LIFECYCLE_KIND_STOP = 2;
  SYNC_LIFECYCLE_KIND_FOREGROUND = 3;
  SYNC_LIFECYCLE_KIND_BACKGROUND = 4;
  SYNC_LIFECYCLE_KIND_RECONNECT_NOW = 5;
  SYNC_LIFECYCLE_KIND_RETRY_LOGIN = 6;
}

message SyncLifecycleAction {
  SyncLifecycleKind kind = 1;
  string home_scope_token = 2;
  bytes scope_hmac_key = 3;
}

message NetworkChangedEvent {
  bool available = 1;
  string signature = 2;
}

enum TimerKind {
  TIMER_KIND_UNSPECIFIED = 0;
  TIMER_KIND_RECONNECT = 1;
  TIMER_KIND_STREAM_OPEN = 2;
  TIMER_KIND_LIVENESS = 3;
  TIMER_KIND_LINK_GRACE = 4;
  TIMER_KIND_LIST_RETRY = 5;
  TIMER_KIND_PREFS_RETRY = 6;
  TIMER_KIND_HISTORY_SWEEP = 7;
  TIMER_KIND_LIVE_POLL = 8;
  TIMER_KIND_COMMAND_RETRY = 9;
  TIMER_KIND_SESSION_UNDO = 10;
  TIMER_KIND_SESSION_STEER_GRACE = 11;
  TIMER_KIND_DIRECT_ENGINE = 12;
  TIMER_KIND_DIRECT_SESSION = 13;
  TIMER_KIND_TERMINAL_REOPEN = 14;
}

message TimerFiredEvent {
  uint64 timer_id = 1;
  TimerKind kind = 2;
  string key = 3;
}

// Plaintext machine decrypted and verified by the shell's security gate.
message PlainMachine {
  string machine_id = 1;
  bool online = 2;
  int64 last_seen_ms = 3;
  remoteagent.v1.MachineMeta meta = 4;
  uint64 meta_rev = 5;
  bool meta_broken = 6;
  string cache_ref = 7;
}

// Plaintext session decrypted and verified by the shell's security gate.
message PlainSession {
  string session_id = 1;
  string machine_id = 2;
  uint64 last_seq = 3;
  int64 updated_ms = 4;
  int64 listed_ended_ms = 5;
  remoteagent.v1.Session meta = 6;
  uint64 meta_rev = 7;
  remoteagent.v1.LiveSnapshot checkpoint = 8;
  bool checkpoint_invalid = 9;
  bool retired_history = 10;
  bool open_failed = 11;
  string cache_ref = 12;
}

// Plaintext event decrypted and verified by the shell's security gate.
message PlainEvent {
  uint64 seq = 1;
  remoteagent.v1.Event event = 2;
  bool verified = 3;
  bool unavailable = 4;
  bool broken = 5;
  bool retired = 6;
  int64 approx_bytes = 7;
  string cache_ref = 8;
}

// Plaintext device decrypted and verified by the shell's security gate.
message PlainDevice {
  string device_id = 1;
  remoteagent.v1.DeviceKind kind = 2;
  int64 created_ms = 3;
  int64 last_seen_ms = 4;
  remoteagent.v1.DeviceMeta meta = 5;
  uint64 meta_rev = 6;
  bool meta_broken = 7;
}

// Plaintext account preferences decrypted and verified by the shell's security gate.
message PlainAccountPrefs {
  uint64 revision = 1;
  remoteagent.v1.ProjectPrefs prefs = 2;
  bool broken = 3;
  string cache_ref = 4;
}

message CacheBootstrapLoadedEvent {
  uint64 op_id = 1;
  repeated PlainMachine machines = 2;
  repeated PlainSession sessions = 3;
  PlainAccountPrefs prefs = 4;
  string home_scope_token = 5;
  bytes scope_hmac_key = 6;
  string error = 7;
}

message CacheEventsLoadedEvent {
  uint64 op_id = 1;
  string session_id = 2;
  repeated PlainEvent events = 3;
  bool broken = 4;
  bool retired = 5;
  string error = 6;
}

message TokenResultEvent {
  uint64 op_id = 1;
  string token = 2;
  int64 expires_ms = 3;
  bool removed = 4;
  string error_code = 5;
  string error = 6;
  bool unresolved_host = 7;
}

message SecuritySnapshotEvent {
  uint64 op_id = 1;
  bool is_member = 2;
  string authority_device_id = 3;
  repeated string trusted_machine_ids = 4;
  repeated string trusted_client_ids = 5;
  repeated string archive_machine_ids = 6;
  uint64 head_epoch = 7;
  int64 lease_end_ms = 8;
  bool clock_skewed = 9;
  bool recovery_pending = 10;
  int64 recovery_ready_ms = 11;
  bool recovery_objects_pending = 12;
  uint64 network_generation = 13;
  string error = 14;
  bool unresolved_host = 15;
  string self_device_id = 16;
  uint64 push_seq = 17;
}

message StreamReadyEvent {
  uint64 leg_id = 1;
  int64 server_time_ms = 2;
}

message StreamClosedEvent {
  uint64 leg_id = 1;
  bool policy_violation = 2;
  string error_code = 3;
  string error = 4;
  bool unresolved_host = 5;
}

message EventsAppendedFrame {
  string session_id = 1;
  repeated PlainEvent events = 2;
}

message StreamFrameEvent {
  uint64 leg_id = 1;
  oneof frame {
    bool heartbeat = 2;
    PlainMachine machine_updated = 3;
    string machine_removed_id = 4;
    PlainSession session_updated = 5;
    EventsAppendedFrame events_appended = 6;
    PlainAccountPrefs account_prefs_updated = 7;
    PlainDevice device_updated = 8;
    string device_removed_id = 9;
  }
}

message ListsFetchedEvent {
  uint64 op_id = 1;
  repeated PlainMachine machines = 2;
  repeated PlainSession sessions = 3;
  remoteagent.v1.SessionCursor next = 4;
  repeated PlainDevice devices = 5;
  string error = 6;
  bool unresolved_host = 7;
}

message SessionsPageFetchedEvent {
  uint64 op_id = 1;
  repeated PlainSession sessions = 2;
  remoteagent.v1.SessionCursor next = 3;
  string error = 4;
}

message SessionByIdFetchedEvent {
  uint64 op_id = 1;
  PlainSession session = 2;
  string error = 3;
}

message EventsPageFetchedEvent {
  uint64 op_id = 1;
  string session_id = 2;
  repeated PlainEvent events = 3;
  bool more = 4;
  string error = 5;
}

message AccountPrefsFetchedEvent {
  uint64 op_id = 1;
  PlainAccountPrefs prefs = 2;
  string error = 3;
}

message AccountPrefsPutResultEvent {
  uint64 op_id = 1;
  bool applied = 2;
  PlainAccountPrefs current = 3;
  bool seal_conflict = 4;
  string error = 5;
}

message DevicesFetchedEvent {
  uint64 op_id = 1;
  repeated PlainDevice devices = 2;
  string error = 3;
  uint64 push_seq = 4;
}

enum OutcomeSource {
  OUTCOME_SOURCE_UNSPECIFIED = 0;
  OUTCOME_SOURCE_LOCAL = 1;
  OUTCOME_SOURCE_SERVER = 2;
  OUTCOME_SOURCE_DAEMON = 3;
  OUTCOME_SOURCE_TRANSPORT = 4;
}

message CommandOutcomeEvent {
  string request_id = 1;
  string attempt_id = 2;
  OutcomeSource source = 3;
  bool not_forwarded = 4;
  bool attempt_bound = 5;
  bool signed = 6;
  bool hashes_match = 7;
  bool outer_matches_inner = 8;
  string outer_outcome = 9;
  string outer_reason = 10;
  remoteagent.v1.CommandResult result = 11;
  string transport_code = 12;
  string transport_detail = 13;
  bool route_was_direct = 14;
  double elapsed_ms = 15;
  int64 observed_bytes = 16;
  bool handed_off = 17;
  uint64 direct_ticket_id = 18;
}

message SessionWatchEvent {
  string session_id = 1;
  bool watched = 2;
}

message SessionPinEvent {
  string session_id = 1;
  bool pinned = 2;
}

message RetrySessionEventsAction {
  string session_id = 1;
}

message FetchSessionAction {
  string session_id = 1;
}

message DirectEventsReceivedEvent {
  string machine_id = 1;
  string session_id = 2;
  repeated PlainEvent events = 3;
  uint64 pc_id = 4;
  string sender = 5;
}

message SessionScheduleHint {
  string session_id = 1;
  string schedule_name = 2;
  bool unread = 3;
}

message SessionScheduleHintsEvent {
  repeated SessionScheduleHint hints = 1;
}

message HomeSetScopeAction {
  string scope_key = 1;
}

message HomeSetFilterAction {
  string query = 1;
}

message HomeLoadMoreEndedAction {
  int32 step = 1;
}

message HomeRetryLoadAction {}

message HomeSelectSessionAction {
  string session_id = 1;
}

message ProjectSetSearchAction {
  string query = 1;
}

message ProjectKeyAction {
  string project_key = 1;
}

message ProjectAddAction {
  string path = 1;
}

message DirPickerOpenAction {
  string machine_id = 1;
  string path = 2;
  bool for_new_task = 3;
}

message DirNavigateAction {
  string machine_id = 1;
  string path = 2;
}

message DirPickerCloseAction {}

message NewSessionOpenAction {
  string project_key = 1;
}

message NewSessionSelectProjectAction {
  string project_key = 1;
}

message NewSessionSelectMachineAction {
  string machine_id = 1;
}

message NewSessionSelectAgentAction {
  remoteagent.v1.Agent agent = 1;
}

message NewSessionSelectModelAction {
  string model = 1;
  string effort = 2;
  optional bool standard_context = 3;
  optional remoteagent.v1.ApprovalMode mode = 4;
}

message NewSessionSetPromptAction {
  string prompt = 1;
  int32 attachment_count = 2;
  bool attachments_moved = 3;
}

message NewSessionProjectAction {
  string project_key = 1;
}

message NewSessionSubmitAction {
  string project_key = 1;
  bool auto_mode_supported = 2;
  repeated string image_ids = 3;
  repeated string file_ids = 4;
}

