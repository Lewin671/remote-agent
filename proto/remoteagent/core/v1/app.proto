enum ScreenTarget {
  SCREEN_TARGET_UNSPECIFIED = 0;
  SCREEN_TARGET_HOME = 1;
  SCREEN_TARGET_PROJECT = 2;
  SCREEN_TARGET_NEW_SESSION = 3;
  // Transitional render target; delete after Steps 3-4 complete.
  SCREEN_TARGET_SYNC_STATE = 4;
  // Transitional render target; delete after Step 3 completes.
  SCREEN_TARGET_SESSION_DATA = 5;
  SCREEN_TARGET_SETTINGS = 30;
  SCREEN_TARGET_MACHINE_STATUS = 31;
  SCREEN_TARGET_MACHINE_SETTINGS = 32;
  SCREEN_TARGET_QUOTA = 33;
  SCREEN_TARGET_DEVICES = 34;
  SCREEN_TARGET_CLIENT_DETAIL = 35;
  SCREEN_TARGET_USAGE = 36;
  SCREEN_TARGET_DIRECT_DIAGNOSTICS = 37;
  SCREEN_TARGET_SESSION = 10;
  SCREEN_TARGET_SCHEDULES = 20;
  SCREEN_TARGET_SCHEDULE_DETAIL = 21;
  SCREEN_TARGET_SCHEDULE_FORM = 22;
  SCREEN_TARGET_SCHEDULE_SESSION_STRIP = 23;
}

message RenderEffect {
  repeated ScreenTarget screens = 1;
}

message OpenStreamEffect {
  uint64 leg_id = 1;
  string token = 2;
  int64 timeout_ms = 3;
}

message CloseStreamEffect {
  uint64 leg_id = 1;
}

message EnsureTokenEffect {
  uint64 op_id = 1;
  bool force_login = 2;
  int64 timeout_ms = 3;
}

message DiscardTokenEffect {
  string token = 1;
}

message SyncSecurityEffect {
  uint64 op_id = 1;
  uint64 network_generation = 2;
  bool touch = 3;
}

message ScheduleTimerEffect {
  uint64 timer_id = 1;
  TimerKind kind = 2;
  string key = 3;
  int64 delay_ms = 4;
}

message CancelTimerEffect {
  uint64 timer_id = 1;
  TimerKind kind = 2;
  string key = 3;
}

message CacheReadBootstrap {
  uint64 op_id = 1;
}

message CacheReadEvents {
  uint64 op_id = 1;
  string session_id = 2;
  bool newest = 3;
  uint64 after_seq = 4;
  int32 limit = 5;
}

message CacheReadEffect {
  oneof kind {
    CacheReadBootstrap bootstrap = 1;
    CacheReadEvents events = 2;
  }
}

message CacheWriteEvents {
  string session_id = 1;
  repeated string cache_refs = 2;
}

message CacheSessionOpen {
  string session_id = 1;
  bool open = 2;
}

message CacheWriteEffect {
  oneof kind {
    string write_machine_ref = 1;
    string write_session_ref = 2;
    string keep_session_owner_ref = 3;
    CacheWriteEvents write_events = 4;
    string write_prefs_ref = 5;
    CacheSessionOpen set_session_open = 6;
  }
}

message CacheDeleteEffect {
  oneof kind {
    string drop_events_session_id = 1;
    string remove_session_id = 2;
    string unlist_session_id = 3;
    string remove_machine_id = 4;
  }
}

message FetchListsRpc {
  uint32 limit = 1;
}

message FetchSessionsPageRpc {
  remoteagent.v1.SessionCursor after = 1;
  uint32 limit = 2;
}

message FetchSessionByIdRpc {
  string session_id = 1;
}

message GetEventsRpc {
  string session_id = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message GetAccountPrefsRpc {
  string object_id = 1;
}

message PutAccountPrefsRpc {
  string object_id = 1;
  uint64 expected_revision = 2;
  remoteagent.v1.ProjectPrefs next_prefs = 3;
}

message FetchDevicesRpc {
  bool force = 1;
}

message RpcEffect {
  uint64 op_id = 1;
  oneof kind {
    FetchListsRpc fetch_lists = 2;
    FetchSessionsPageRpc fetch_sessions_page = 3;
    FetchSessionByIdRpc fetch_session_by_id = 4;
    GetEventsRpc get_events = 5;
    GetAccountPrefsRpc get_account_prefs = 6;
    PutAccountPrefsRpc put_account_prefs = 7;
    FetchDevicesRpc fetch_devices = 8;
  }
}

enum CommandRouteHint {
  COMMAND_ROUTE_HINT_UNSPECIFIED = 0;
  COMMAND_ROUTE_HINT_NORMAL = 1;
  COMMAND_ROUTE_HINT_READ = 2;
  COMMAND_ROUTE_HINT_BULK = 3;
}

message DispatchCommandEffect {
  string request_id = 1;
  string attempt_id = 2;
  string machine_id = 3;
