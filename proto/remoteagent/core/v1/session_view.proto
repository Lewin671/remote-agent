syntax = "proto3";

package remoteagent.core.v1;

import "remoteagent/core/v1/home_view.proto";
import "remoteagent/core/v1/text.proto";
import "remoteagent/v1/event.proto";
import "remoteagent/v1/local.proto";
import "remoteagent/v1/remote.proto";

// SessionScreenRequest requests the computed view model for one session.
message SessionScreenRequest {
  string session_id = 1;
  SessionWindowRequest window = 2;
}

// SessionWindowRequest controls timeline tail windowing, earlier paging, and schedule reveals.
message SessionWindowRequest {
  // Maximum timeline items returned; defaults to 80 when <= 0.
  int32 limit = 1;
  // When non-zero, returns items ending strictly before this sequence number.
  uint64 before_seq = 2;
  // When non-zero, centers the returned window around this sequence number.
  uint64 around_seq = 3;
  // When non-zero, expands any quiet scheduled run group covering this seq and anchors to it.
  uint64 reveal_seq = 4;
  // When non-empty, expands any quiet scheduled run group matching this run_id and anchors to it.
  string reveal_run_id = 5;
  // Additional quiet scheduled or tool group IDs to keep expanded.
  repeated string expanded_group_ids = 6;
}

// SessionViewModel is the complete screen state for a single session across Web, Android, and iOS.
message SessionViewModel {
  string session_id = 1;
  SessionHeaderView header = 2;
  SessionActionsView actions = 3;
  SessionDockView dock = 4;
  SessionComposerView composer = 5;
  SessionTimelineView timeline = 6;
}

enum SessionCommandStatus {
  SESSION_COMMAND_STATUS_UNSPECIFIED = 0;
  SESSION_COMMAND_STATUS_IDLE = 1;
  SESSION_COMMAND_STATUS_PENDING = 2;
  SESSION_COMMAND_STATUS_FAILED = 3;
  SESSION_COMMAND_STATUS_UNKNOWN = 4;
}

// SessionCommandState captures the sync.SubmitCommand lifecycle for one action slot.
message SessionCommandState {
  string slot_key = 1;
  string request_id = 2;
  SessionCommandStatus status = 3;
  bool busy = 4;
  bool frozen = 5;
  bool expired = 6;
  bool can_retry = 7;
  bool can_abandon = 8;
  string error_code = 9;
  Text error_text = 10;
  Text status_text = 11;
}

message SessionCapabilitiesView {
  bool can_send = 1;
  bool supports_images = 2;
  bool supports_files = 3;
  bool supports_send_modes = 4;
  bool supports_shared_files = 5;
  bool supports_always_allow = 6;
  bool supports_steer = 7;
  bool supports_compact = 8;
  bool supports_fork = 9;
  bool supports_model_switch = 10;
  bool supports_mode_switch = 11;
  bool supports_schedule = 12;
  bool terminal_available = 13;
  Text terminal_hint = 14;
  int32 max_images = 15;
}

message SessionHeaderView {
