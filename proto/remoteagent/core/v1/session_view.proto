  SESSION_IMAGE_SOURCE_KIND_GENERATED = 3;
}

message SessionViewerImageView {
  int32 viewer_index = 1;
  uint64 seq = 2;
  int32 event_image_index = 3;
  int64 timestamp_ms = 4;
  SessionImageSourceKind kind = 5;
  remoteagent.v1.ImageRef ref = 6;
  string tool_title = 7;
  string revised_prompt = 8;
  Text source_label = 9;
  string size_text = 10;
  double aspect_ratio = 11;
  double clamped_aspect_ratio = 12;
  bool has_display_copy = 13;
  string display_name = 14;
  string display_path = 15;
  string file_extension = 16;
  string mime_type = 17;
  bool in_collapsed_group = 18;
  // Always non-empty sanitized filename for downloading/saving/sharing (falls back to "image-<N>.<ext>").
  string download_name = 19;
  string image_id = 20;
  SessionImageSyncState sync_state = 21;
  int32 width = 22;
  int32 height = 23;
  bytes preview = 24;
  remoteagent.v1.ImageFormat preview_format = 25;
}

message SessionImageViewerView {
  bool open = 1;
  int32 current_index = 2;
  int32 total_count = 3;
  bool has_prev = 4;
  bool has_next = 5;
  Text position_text = 6;
  SessionViewerImageView current_image = 7;
  Text empty_text = 8;
}

message SessionAsyncQuestionItem {
  string question_id = 1;
  repeated SessionQuestionStepView questions = 2;
}

message SessionPlanItem {
  string markdown = 1;
}

enum SessionNoteTone {
  SESSION_NOTE_TONE_UNSPECIFIED = 0;
  SESSION_NOTE_TONE_NEUTRAL = 1;
  SESSION_NOTE_TONE_POSITIVE = 2;
  SESSION_NOTE_TONE_NEGATIVE = 3;
  SESSION_NOTE_TONE_WARNING = 4;
}

enum SessionNoteKind {
  SESSION_NOTE_KIND_UNSPECIFIED = 0;
  SESSION_NOTE_KIND_APPROVAL = 2;
  SESSION_NOTE_KIND_QUESTION = 3;
  SESSION_NOTE_KIND_INTERRUPTED = 4;
  SESSION_NOTE_KIND_COMPACTED = 5;
  SESSION_NOTE_KIND_MODEL_CHANGED = 6;
  SESSION_NOTE_KIND_MODE_CHANGED = 7;
  SESSION_NOTE_KIND_TERMINAL_CHANGES = 8;
}

message SessionNoteItem {
  SessionNoteKind kind = 1;
  SessionNoteTone tone = 2;
  Text text = 3;
  Text meta = 4;
  Text emphasis = 5;
  string scheduled_run_id = 6;
}

// A scheduled run's push left in the conversation as a one-line receipt
// (design-system.md §7). Core decides what the line says; shells render
// "label · preview" collapsed and "label · time" plus body when open.
message SessionNotifyReceiptItem {
  // 「已通知你」.
  Text label = 1;
  // When the push went out: the clock today, with the date otherwise.
  Text time = 2;
  // The body's first line, shown after the label while collapsed. Empty for
  // a push the computer sent on the agent's behalf whose text repeats the
  // reply above: the line then shows the time instead.
  string preview = 3;
  // The whole body, shown when opened; set only when expandable.
  string body = 4;
  // The body has a line break or runs past 40 half-width columns.
  bool expandable = 5;
  string scheduled_run_id = 6;
}

message SessionTurnEndItem {
  remoteagent.v1.TurnOutcome outcome = 1;
  int64 duration_ms = 2;
  int64 turn_tokens = 3;
  Text label = 4;
  bool interrupted = 5;
  bool is_session_ended = 6;
}

message SessionErrorLineItem {
  string raw_reason = 1;
  Text text = 2;
}

message SessionForkItem {
  string source_session_id = 1;
  Text source_title = 2;
  Text text = 3;
}

enum SessionInputNoticeKind {
  SESSION_INPUT_NOTICE_KIND_UNSPECIFIED = 0;
  SESSION_INPUT_NOTICE_KIND_UNSENT_ON_EXIT = 1;
  SESSION_INPUT_NOTICE_KIND_CANCELED = 2;
  SESSION_INPUT_NOTICE_KIND_FAILED = 3;
  SESSION_INPUT_NOTICE_KIND_NEEDS_TERMINAL = 4;
  SESSION_INPUT_NOTICE_KIND_UNCONFIRMED = 5;
}

message SessionInputStateItem {
  SessionInputNoticeKind kind = 1;
  string request_id = 2;
  string preview = 3;
  Text status_text = 4;
  Text reason_text = 5;
}

message SessionQuietScheduledGroupItem {
  string group_id = 1;
  string scheduled_task_id = 2;
  int32 run_count = 3;
  repeated int64 run_times_ms = 4;
  repeated string run_ids = 5;
  Text title = 6;
  bool expanded = 7;
  repeated SessionTimelineItem items = 8;
}

message SessionSkeletonItem {
  Text text = 1;
}

// SessionSubmitCommandAction dispatches any session/machine command through sync.SubmitCommand.
message SessionSubmitCommandAction {
  string slot_key = 1;
  string machine_id = 2;
  string session_id = 3;
  remoteagent.v1.Command command = 4;
}

// SessionSlotAction references one command attempt slot (e.g. abandon).
message SessionSlotAction {
  string slot_key = 1;
  string session_id = 2;
}

// SessionOpenAction opens the session screen, fetching models/settings as needed.
message SessionOpenAction {
  string session_id = 1;
  bool refresh_models = 2;
  bool refresh_settings = 3;
}

// SessionTrayItemAction acts on a single item inside the composer's pending tray.
message SessionTrayItemAction {
  string session_id = 1;
  string request_id = 2;
}

// SessionTraySessionAction acts on session-wide pending tray state (cancel all paused / undo).
message SessionTraySessionAction {
  string session_id = 1;
}

// SessionQuestionStepAction sets or moves the active step index on a multi-question dock item.
message SessionQuestionStepAction {
  string session_id = 1;
  string question_id = 2;
  int32 question_index = 3;
}

// SessionRefreshHistoryAction requests earlier session history backfill when available.
message SessionRefreshHistoryAction {
  string session_id = 1;
}

// SessionRetryLoadAction retries loading a session that failed lookup or event sync.
message SessionRetryLoadAction {
  string session_id = 1;
}

// SessionImageViewerOpenAction opens the session image viewer anchored to an event image or viewer index.
message SessionImageViewerOpenAction {
  string session_id = 1;
  uint64 seq = 2;
  int32 image_index = 3;
  int32 viewer_index = 4;
}

// SessionImageViewerNavigateAction moves the open session image viewer by delta or to an explicit index.
message SessionImageViewerNavigateAction {
  string session_id = 1;
  int32 delta = 2;
  bool set_index = 3;
  int32 index = 4;
}

// SessionImageViewerCloseAction closes the session image viewer.
message SessionImageViewerCloseAction {
  string session_id = 1;
}

// SessionRestoreComposerEffect instructs the shell to focus the composer
// after Core puts a message's text and attachments back into the draft.
message SessionRestoreComposerEffect {
  reserved 3, 4, 5, 6;
  reserved "text", "image_ids", "file_ids", "handled_by_core";
  string session_id = 1;
  string request_id = 2;
}

// SessionEditApprovalDenyAction toggles whether the approval deny reason form is open.
message SessionEditApprovalDenyAction {
  string session_id = 1;
  string approval_id = 2;
  bool denying_open = 3;
}

// SessionResolveApprovalAction resolves a pending approval on a session.
message SessionResolveApprovalAction {
  string session_id = 1;
  string approval_id = 2;
  bool allow = 3;
  bool always = 4;
  string deny_reason = 5;
}

// SessionToggleQuestionOptionAction toggles one option in a multi-select question step.
message SessionToggleQuestionOptionAction {
  string session_id = 1;
  string question_id = 2;
  int32 option_num = 3;
}

// SessionAnswerQuestionAction submits the active step answer for a pending question.
message SessionAnswerQuestionAction {
  string session_id = 1;
  string question_id = 2;
  int32 option_num = 3;
  repeated int32 option_nums = 4;
}

// SessionAnswerPlanAction submits the user's decision on a proposed plan.
message SessionAnswerPlanAction {
  string session_id = 1;
  remoteagent.v1.PlanChoice choice = 2;
}

enum SessionSimpleCommandKind {
  SESSION_SIMPLE_COMMAND_KIND_UNSPECIFIED = 0;
  SESSION_SIMPLE_COMMAND_KIND_INTERRUPT = 1;
  SESSION_SIMPLE_COMMAND_KIND_STOP = 2;
  SESSION_SIMPLE_COMMAND_KIND_RESUME = 3;
  SESSION_SIMPLE_COMMAND_KIND_FORK = 4;
  SESSION_SIMPLE_COMMAND_KIND_COMPACT = 5;
}

// SessionSimpleCommandAction triggers a parameterless session lifecycle command.
message SessionSimpleCommandAction {
  string session_id = 1;
  SessionSimpleCommandKind kind = 2;
}

// SessionRenameAction renames a session; Core trims, collapses newlines, and clamps to 60 code points.
message SessionRenameAction {
  string session_id = 1;
  string title = 2;
}

// SessionSetApprovalModeAction switches the session approval mode.
message SessionSetApprovalModeAction {
  string session_id = 1;
  remoteagent.v1.ApprovalMode mode = 2;
}

// SessionSetModelAction switches the session model and/or reasoning effort.
message SessionSetModelAction {
  string session_id = 1;
  string model = 2;
  string effort = 3;
}

// SessionRetryCommandAction retries the last submitted semantic payload for slot_key.
message SessionRetryCommandAction {
  string session_id = 1;
  string slot_key = 2;
}

