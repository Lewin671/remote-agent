syntax = "proto3";

package remoteagent.core.v1;

import "remoteagent/core/v1/text.proto";
import "remoteagent/v1/envelope.proto";
import "remoteagent/v1/event.proto";
import "remoteagent/v1/local.proto";
import "remoteagent/v1/relay.proto";
import "remoteagent/v1/remote.proto";

// ---- Security Engine Configuration & Record Sync (S5) ----

message SecurityConfigEvent {
  string account = 1;
  string device_id = 2;
  // False on Web (heavy batch Ed25519 verify >8 and AEAD >16 KiB route via CryptoBatchEffect).
  // True on Android/iOS (Core executes crypto synchronously in Go).
  bool inline_crypto = 3;
  string server = 4;
  bool legacy_cleared = 5;
  bool foreground = 6;
}

message SecurityForegroundEvent {
  bool foreground = 1;
}

// ---- Externalized Private-Key Effects & Events ----

enum SecurityKeyKind {
  SECURITY_KEY_KIND_UNSPECIFIED = 0;
  SECURITY_KEY_KIND_DEVICE_ED = 1;
  SECURITY_KEY_KIND_DEVICE_X = 2;
  SECURITY_KEY_KIND_CANDIDATE_ED = 3;
  SECURITY_KEY_KIND_CANDIDATE_X = 4;
  SECURITY_KEY_KIND_EPHEMERAL_X = 5;
}

message SecurityKeySignEffect {
  uint64 op_id = 1;
  SecurityKeyKind key_kind = 2;
  string slot = 3;
  bytes message = 4;
}

message SecurityKeySignedEvent {
  uint64 op_id = 1;
  bytes signature = 2;
  string error = 3;
}

message SecurityKeyAgreeEffect {
  uint64 op_id = 1;
  SecurityKeyKind key_kind = 2;
  string slot = 3;
  bytes peer_public = 4;
}

message SecurityKeyAgreedEvent {
  uint64 op_id = 1;
  bytes shared = 2;
  string error = 3;
}

// ---- Web CryptoBatch Offload (verify > 8 items, AEAD > 16 KiB) ----

message CryptoBatchVerifyItem {
  bytes public_key = 1;
  bytes message = 2;
  bytes signature = 3;
}

message CryptoBatchAeadOpenItem {
  bytes key = 1;
  bytes nonce = 2;
  bytes aad = 3;
  bytes ciphertext = 4;
}

message CryptoBatchAeadSealItem {
  bytes key = 1;
  bytes nonce = 2;
  bytes aad = 3;
  bytes plaintext = 4;
}

message CryptoBatchSha256Item {
  bytes data = 1;
}

message SecurityCryptoBatchItem {
  oneof kind {
    CryptoBatchVerifyItem verify = 1;
    CryptoBatchAeadOpenItem aead_open = 2;
    CryptoBatchAeadSealItem aead_seal = 3;
    CryptoBatchSha256Item sha256 = 4;
  }
}

message SecurityCryptoBatchEffect {
  uint64 op_id = 1;
  repeated SecurityCryptoBatchItem items = 2;
}

message SecurityCryptoBatchResult {
  bool ok = 1;
  bytes data = 2;
  string error = 3;
}

message SecurityCryptoBatchDoneEvent {
  uint64 op_id = 1;
  repeated SecurityCryptoBatchResult results = 2;
  string error = 3;
}

// ---- Stateful Shell Op Bridge (for workflows still in shells in S5) ----

message SecurityOpenEnvelopeOp {
  remoteagent.v1.Envelope envelope = 1;
  uint32 expected_purpose = 2;
  string machine_id = 3;
  string session_id = 4;
  string request_id = 5;
  uint64 seq = 6;
  bool history = 7;
  bytes override_session_seed = 8;
}

message SecuritySealEnvelopeOp {
  uint32 purpose = 1;
  string machine_id = 2;
  string session_id = 3;
  string request_id = 4;
  uint64 seq = 5;
  int64 deadline_ms = 6;
  bytes plaintext = 7;
  bool use_session_seed = 8;
  bytes override_session_seed = 9;
}

message SecurityGetSessionSeedOp {
  string session_id = 1;
}

message SecurityOpRequestEvent {
  uint64 op_id = 1;
  oneof op {
    SecurityOpenEnvelopeOp open_envelope = 2;
    SecuritySealEnvelopeOp seal_envelope = 3;
    SecurityGetSessionSeedOp get_session_seed = 4;
  }
}

message SecurityOpenEnvelopeResult {
  bytes header = 1;
  bytes plaintext = 2;
  uint64 epoch = 3;
  uint64 content_epoch = 4;
  uint64 seq = 5;
  string sender = 6;
  uint32 purpose = 7;
  string machine_id = 8;
  string session_id = 9;
  string request_id = 10;
  int64 deadline_ms = 11;
}

message SecuritySealEnvelopeResult {
  remoteagent.v1.Envelope envelope = 1;
  bytes request_key_hash = 2;
  bytes payload_hash = 3;
}

enum SecurityErrorCode {
  SECURITY_ERROR_CODE_UNSPECIFIED = 0;
  SECURITY_ERROR_CODE_INVALID = 1;
  SECURITY_ERROR_CODE_UNTRUSTED = 2;
  SECURITY_ERROR_CODE_STALE = 3;
  SECURITY_ERROR_CODE_LEASE_EXPIRED = 4;
  SECURITY_ERROR_CODE_CLOCK_SKEWED = 5;
  SECURITY_ERROR_CODE_CAPACITY = 6;
  SECURITY_ERROR_CODE_RECOVERY_UNAVAILABLE = 7;
  SECURITY_ERROR_CODE_UNSUPPORTED_HISTORY = 8;
  SECURITY_ERROR_CODE_STORAGE = 9;
  SECURITY_ERROR_CODE_CONFLICT = 10;
  SECURITY_ERROR_CODE_PERMISSION_DENIED = 11;
  SECURITY_ERROR_CODE_NOT_FOUND = 12;
  SECURITY_ERROR_CODE_FAILED_PRECONDITION = 13;
  SECURITY_ERROR_CODE_RESOURCE_EXHAUSTED = 14;
  SECURITY_ERROR_CODE_CANCELED = 15;
  SECURITY_ERROR_CODE_UNAVAILABLE = 16;
  SECURITY_ERROR_CODE_FOREGROUND = 17;
}

message SecurityOpResultEffect {
  reserved 3;
  reserved "error_code";
  uint64 op_id = 1;
  string error = 2;
  oneof result {
    SecurityOpenEnvelopeResult opened = 4;
    SecuritySealEnvelopeResult sealed = 5;
    bytes session_seed = 6;
  }
  SecurityErrorCode structured_error_code = 7;
}

// ---- Demo/Gallery Mode Seeding (permanently locked out once real security is initialized) ----

message DemoMachine {
  string machine_id = 1;
  bool online = 2;
  int64 last_seen_ms = 3;
  remoteagent.v1.MachineMeta meta = 4;
}

message DemoSession {
  string session_id = 1;
  string machine_id = 2;
  uint64 last_seq = 3;
  int64 updated_ms = 4;
  int64 listed_ended_ms = 5;
  remoteagent.v1.Session meta = 6;
  remoteagent.v1.LiveSnapshot checkpoint = 7;
}

message DemoDevice {
  string device_id = 1;
  remoteagent.v1.DeviceKind kind = 2;
  int64 created_ms = 3;
  int64 last_seen_ms = 4;
  remoteagent.v1.DeviceMeta meta = 5;
}

message DemoSessionEvents {
  string session_id = 1;
  repeated remoteagent.v1.Event events = 2;
}

message DemoSecurity {
  bool is_member = 1;
  bool removed = 2;
  string self_device_id = 3;
  string authority_device_id = 4;
  repeated string trusted_machine_ids = 5;
  repeated string trusted_client_ids = 6;
  repeated string archive_machine_ids = 7;
  uint64 head_epoch = 8;
  int64 lease_end_ms = 9;
  bool clock_skewed = 10;
  bool recovery_pending = 11;
  int64 recovery_ready_ms = 12;
  bool recovery_objects_pending = 13;
  uint64 network_generation = 14;
}

message SeedDemoWorldEvent {
  repeated DemoMachine machines = 1;
  repeated DemoSession sessions = 2;
  repeated DemoDevice devices = 3;
  remoteagent.v1.ProjectPrefs prefs = 4;
  repeated DemoSessionEvents session_events = 5;
  DemoSecurity security = 6;
}

// ---- Wire Cache Helpers ----

message CacheWriteStoredEvents {
  string session_id = 1;
  repeated remoteagent.v1.StoredEvent events = 2;
}

// ---- S6 Externalized Key Generation, KEM, Discard & CAS Storage ----

message SecurityKeyGenerateEffect {
  uint64 op_id = 1;
  SecurityKeyKind key_kind = 2;
  string slot = 3;
  bool persist = 4;
}

message SecurityKeyGeneratedEvent {
  uint64 op_id = 1;
  bytes public_key = 2;
  string error = 3;
}

message SecurityEncapsulateRecipient {
  string member_id = 1;
  bytes x_public = 2;
}

message SecurityKeyEncapsulateEffect {
  uint64 op_id = 1;
  repeated SecurityEncapsulateRecipient recipients = 2;
}

message SecurityEncapsulatedPair {
  string member_id = 1;
  bytes enc = 2;
  bytes dh = 3;
}

message SecurityKeyEncapsulatedEvent {
  uint64 op_id = 1;
  repeated SecurityEncapsulatedPair pairs = 2;
  string error = 3;
}

message SecurityKeyDiscardEffect {
  SecurityKeyKind key_kind = 1;
  string slot = 2;
}

enum SecurityStoreBucket {
  SECURITY_STORE_BUCKET_UNSPECIFIED = 0;
  SECURITY_STORE_BUCKET_RECORD = 1;
  SECURITY_STORE_BUCKET_OPERATION = 2;
  SECURITY_STORE_BUCKET_REGISTRATION_INTENT = 3;
  SECURITY_STORE_BUCKET_PAIRING_CANDIDATE = 4;
  SECURITY_STORE_BUCKET_PUBLIC_PROFILE = 5;
  SECURITY_STORE_BUCKET_NOTIFY_RECORD = 6;
}

enum SecurityStorageOp {
  SECURITY_STORAGE_OP_UNSPECIFIED = 0;
  SECURITY_STORAGE_OP_READ = 1;
  SECURITY_STORAGE_OP_WRITE_CAS = 2;
  SECURITY_STORAGE_OP_DELETE_CAS = 3;
  SECURITY_STORAGE_OP_BATCH_COMMIT = 4;
  SECURITY_STORAGE_OP_READ_BOOTSTRAP = 5;
  SECURITY_STORAGE_OP_CLEAR_ALL = 6;
}

message SecurityStorageEntry {
  SecurityStoreBucket bucket = 1;
  string key = 2;
  string revision = 3;
  bytes data = 4;
}

message SecurityStorageWrite {
  SecurityStoreBucket bucket = 1;
  string key = 2;
  string expected_revision = 3;
  string next_revision = 4;
  bool create_only = 5;
  bool remove = 6;
  bytes data = 7;
}

message SecurityStorageEffect {
  uint64 op_id = 1;
  SecurityStorageOp op = 2;
  SecurityStoreBucket bucket = 3;
  string key = 4;
  string expected_revision = 5;
  string next_revision = 6;
  bool create_only = 7;
  bytes data = 8;
  repeated SecurityStorageWrite batch = 9;
  string promote_ed_slot = 10;
  string promote_x_slot = 11;
  bool clear_login_token = 12;
  repeated string discard_slots = 13;
}

message SecurityStorageResultEvent {
  uint64 op_id = 1;
  bool found = 2;
  string revision = 3;
  bytes data = 4;
  bool conflict = 5;
  string error = 6;
  repeated SecurityStorageEntry entries = 7;
  bool has_device_ed = 8;
  bytes device_ed_pub = 9;
  bool has_device_x = 10;
  bytes device_x_pub = 11;
  bool legacy_cleared = 12;
}

// ---- S6 Unified Security RPC Transport ----

enum SecurityRpcMethod {
  SECURITY_RPC_METHOD_UNSPECIFIED = 0;
  SECURITY_RPC_METHOD_GET_SECURITY_STATES = 1;
  SECURITY_RPC_METHOD_PUT_SECURITY_STATE = 2;
  SECURITY_RPC_METHOD_PIN_SECURITY_DOMAIN = 3;
  SECURITY_RPC_METHOD_CREATE_PAIRING = 4;
  SECURITY_RPC_METHOD_PEEK_PAIRING = 5;
  SECURITY_RPC_METHOD_JOIN_PAIRING = 6;
  SECURITY_RPC_METHOD_REVEAL_PAIRING = 7;
  SECURITY_RPC_METHOD_APPROVE_PAIRING = 8;
  SECURITY_RPC_METHOD_GET_PAIRING = 9;
  SECURITY_RPC_METHOD_CANCEL_PAIRING = 10;
  SECURITY_RPC_METHOD_GET_RECOVERY_CHALLENGE = 11;
  SECURITY_RPC_METHOD_GET_RECOVERY_CONTEXT = 12;
  SECURITY_RPC_METHOD_SUBMIT_RECOVERY = 13;
  SECURITY_RPC_METHOD_COMPLETE_RECOVERY = 14;
  SECURITY_RPC_METHOD_DELETE_MACHINE_RECORDS = 15;
  SECURITY_RPC_METHOD_DELETE_ACCOUNT = 16;
  SECURITY_RPC_METHOD_GET_CHALLENGE = 17;
  SECURITY_RPC_METHOD_LOGIN = 18;
  SECURITY_RPC_METHOD_GET_SIGNUP_CHALLENGE = 19;
  SECURITY_RPC_METHOD_REGISTER_DEVICE = 20;
  SECURITY_RPC_METHOD_PUT_DEVICE_META = 21;
  SECURITY_RPC_METHOD_LIST_DEVICES = 22;
  SECURITY_RPC_METHOD_LIST_MACHINES = 23;
  SECURITY_RPC_METHOD_GET_ACCOUNT_PREFS = 24;
  SECURITY_RPC_METHOD_PUT_ACCOUNT_PREFS = 25;
}

message SecurityRpcEffect {
  uint64 op_id = 1;
  SecurityRpcMethod method = 2;
  string server = 3;
  string auth_token = 4;
  bytes request_bytes = 5;
}

message SecurityRpcResultEvent {
  uint64 op_id = 1;
  bytes response_bytes = 2;
  int32 connect_code = 3;
  string error = 4;
  bool network_error = 5;
}

message SecurityTokenUpdatedEffect {
  string token = 1;
  int64 expires_ms = 2;
  bool cleared = 3;
}

// ---- S6 Security Workflows & Push Notify Opening ----

enum SecurityBootstrapKind {
  SECURITY_BOOTSTRAP_KIND_UNSPECIFIED = 0;
  SECURITY_BOOTSTRAP_KIND_EMPTY = 1;
  SECURITY_BOOTSTRAP_KIND_READY = 2;
  SECURITY_BOOTSTRAP_KIND_INVALID = 3;
  SECURITY_BOOTSTRAP_KIND_CLOCK_SKEWED = 4;
  SECURITY_BOOTSTRAP_KIND_PENDING_CREATE = 5;
  SECURITY_BOOTSTRAP_KIND_PENDING_RECOVERY = 6;
  SECURITY_BOOTSTRAP_KIND_PENDING_REGISTRATION = 7;
  SECURITY_BOOTSTRAP_KIND_REMOVED = 8;
}

message SecurityPendingOpSummary {
  string kind = 1;
  string phase = 2;
  string action = 3;
  bool code_saved = 4;
  bool signed = 5;
  bool has_delivery = 6;
  string delivery_pairing_id = 7;
  string delivery_candidate_id = 8;
  string recovery_id = 9;
  int64 recovery_ready_ms = 10;
  bool rejected = 11;
  string target_device_id = 12;
  string server = 13;
}

message SecurityWorkflowStatus {
  SecurityBootstrapKind bootstrap = 1;
  bool legacy_repair_notice = 2;
  bool is_member = 3;
  bool is_authority = 4;
  bool removed = 5;
  string server = 6;
  string device_id = 7;
  string account_id = 8;
  uint64 head_epoch = 9;
  int64 lease_end_ms = 10;
  bool lease_valid = 11;
  bool clock_skewed = 12;
  bool recovery_pending = 13;
  int64 recovery_ready_ms = 14;
  bool recovery_status_stale = 15;
  bool recovery_objects_pending = 16;
  bool needs_recovery_code_rotation = 17;
  bool has_account_public_profile = 18;
  bool has_handoff_offer = 19;
  bool taking_over = 20;
  SecurityPendingOpSummary pending_op = 21;
  string error = 22;
}

message SecurityPairingInfo {
  string pairing_id = 1;
  string code = 2;
  string url = 3;
  int64 expires_ms = 4;
  repeated string sas_emoji = 5;
  remoteagent.v1.DeviceKind joiner_kind = 6;
  bool joined = 7;
  bool approved = 8;
  bool delivered = 9;
  bool registering = 10;
}

message SecurityRecoveryInfo {
  string recovery_id = 1;
  remoteagent.v1.GetRecoveryContextResponse.Phase phase = 2;
  int64 ready_ms = 3;
}

message SecurityHandoffCandidate {
  string device_id = 1;
  bytes recovery_ed = 2;
  string display_name = 3;
}

message SecurityExitAdvice {
  bool authority = 1;
  bool unresolved = 2;
  string message = 3;
}

message SecurityAccountAdopted {
  string server = 1;
  string device_id = 2;
  string account_id = 3;
  bool needs_recovery_rotation = 4;
}

message SecurityActionEmpty {}

message SecurityBoolAction {
  bool flag = 1;
}

message SecurityStringAction {
  string value = 1;
}

message SecuritySyncNowAction {
  bool touch = 1;
  string auth_token = 2;
}

message SecurityPrepareCreationAction {
  string server = 1;
  bool storage_persisted = 2;
}

message SecurityRemoveDeviceAction {
  string device_id = 1;
  bool abandon_pair_delivery = 2;
}

message SecurityServerCodeAction {
  string server = 1;
  string code = 2;
}

message SecurityStartPairingAction {
  string web_origin = 1;
  string replaces_device_id = 2;
}

message SecurityApprovePairingAction {
  string pairing_id = 1;
  bool sas_confirmed = 2;
}

message SecurityStartJoinPairingAction {
  string server = 1;
  string code = 2;
  bytes commit_hint = 3;
  bool existing_repair = 4;
  string existing_server = 5;
  string raw_link = 6;
}

message SecurityUpdateDeviceMetaAction {
  string device_id = 1;
  string name = 2;
  string platform = 3;
  string description = 4;
  bool describe_self_only = 5;
}

message SecurityWorkflowActionEvent {
  uint64 action_id = 1;
  oneof action {
    SecurityActionEmpty bootstrap = 2;
    SecurityActionEmpty dismiss_upgrade_notice = 3;
    SecuritySyncNowAction sync_now = 4;
    SecurityBoolAction renew_lease = 5;
    SecurityActionEmpty resume_pending_op = 6;
    SecurityBoolAction discard_pending_op = 7;
    SecurityPrepareCreationAction prepare_creation = 8;
    SecurityActionEmpty confirm_creation_code_saved = 9;
    SecurityStringAction continue_creation = 10;
    SecurityActionEmpty adopt_creation_without_code = 11;
    SecurityRemoveDeviceAction remove_device = 12;
    SecurityStringAction delete_machine_records = 13;
    SecurityActionEmpty delete_account = 14;
    SecurityActionEmpty prepare_recovery_rotation = 15;
    SecurityActionEmpty confirm_recovery_rotation = 16;
    SecurityBoolAction prepare_handoff_code = 17;
    SecurityActionEmpty publish_handoff_offer = 18;
    SecurityStringAction handoff_authority = 19;
    SecurityServerCodeAction complete_account_public_profile = 20;
    SecurityStartPairingAction start_pairing = 21;
    SecurityStringAction poll_pairing = 22;
    SecurityApprovePairingAction approve_pairing = 23;
    SecurityStringAction finish_pairing_delivery = 24;
    SecurityStringAction cancel_pairing = 25;
    SecurityStartJoinPairingAction start_join_pairing = 26;
    SecurityStringAction confirm_join_sas = 27;
    SecurityStringAction cancel_join_pairing = 28;
    SecurityServerCodeAction prepare_emergency_recovery = 29;
    SecurityStringAction continue_recovery_signing = 30;
    SecurityActionEmpty confirm_recovery_code_saved = 31;
    SecurityActionEmpty resume_recovery = 32;
    SecurityActionEmpty complete_recovery = 33;
    SecurityActionEmpty discard_unsigned_recovery = 34;
    SecurityActionEmpty discard_rejected_recovery = 35;
    SecurityActionEmpty check_exit_advice = 36;
    SecurityActionEmpty clear_security = 37;
    SecurityUpdateDeviceMetaAction update_device_meta = 38;
    SecurityActionEmpty list_handoff_candidates = 39;
    SecurityActionEmpty get_status = 40;
    SecurityActionEmpty check_retained_denied = 41;
    SecurityBoolAction republish_recovery_objects = 42;
  }
}

message SecurityWorkflowResultEffect {
  reserved 4;
  reserved "error_code";
  uint64 action_id = 1;
  bool ok = 2;
  string error = 3;
  bool retryable = 5;
  bool uncertain = 6;
  string error_action = 7;
  SecurityWorkflowStatus status = 8;
  string recovery_code = 9;
  bool resumed_draft = 10;
  bool code_saved = 11;
  bool needs_recovery_rotation = 12;
  SecurityPairingInfo pairing = 13;
  SecurityRecoveryInfo recovery = 14;
  repeated SecurityHandoffCandidate handoff_candidates = 15;
  SecurityExitAdvice exit_advice = 16;
  SecurityAccountAdopted account_adopted = 17;
  bool flag = 18;
  SecurityErrorCode structured_error_code = 19;
}

message SecurityStatusChangedEffect {
  SecurityWorkflowStatus status = 1;
}

message SecurityOpenNotifyEvent {
  uint64 op_id = 1;
  bytes notify_blob = 2;
  bytes record_blob = 3;
  remoteagent.v1.Envelope envelope = 4;
  int64 now_ms = 5;
  string session_id = 6;
  string tag = 7;
  string machine_id = 8;
  remoteagent.v1.NotifyKind expected_kind = 9;
  string event_key = 10;
}

message SecurityNotifyDisplay {
  bool valid = 1;
  remoteagent.v1.NotifyKind kind = 2;
  string tag = 3;
  string machine_id = 4;
  string session_id = 5;
  string approval_id = 6;
  uint64 source_event_seq = 7;
  int64 deadline_ms = 8;
  bool truncated = 9;
  bool critical = 10;
  bool show_detailed_by_default = 11;
  Text title = 12;
  Text body = 13;
  Text generic_body = 14;
  Text sub_text = 15;
  Text big_text = 16;
  Text shared_files_suffix = 17;
  int32 shared_file_count = 18;
}

message SecurityNotifyOpenedEffect {
  uint64 op_id = 1;
  remoteagent.v1.NotifyContent content = 2;
  bytes header_bytes = 3;
  string session_id = 4;
  string machine_id = 5;
  string request_id = 6;
  bool verify_record_unchanged = 7;
  string error = 8;
  SecurityNotifyDisplay display = 9;
}
