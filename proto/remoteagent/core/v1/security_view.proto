// Core-owned top-level recovery phase enum (replaces v1.GetRecoveryContextResponse.Phase in UI).
enum SecurityRecoveryPhase {
  SECURITY_RECOVERY_PHASE_UNSPECIFIED = 0;
  SECURITY_RECOVERY_PHASE_FORM = 1;
  SECURITY_RECOVERY_PHASE_UNSIGNED_DRAFT = 2;
  SECURITY_RECOVERY_PHASE_SUBMITTED_WAITING = 3;
  SECURITY_RECOVERY_PHASE_READY_TO_COMPLETE = 4;
  SECURITY_RECOVERY_PHASE_REJECTED = 5;
}

message EmergencyRecoveryView {
  SecurityRecoveryPhase phase = 1;
  string server_input = 2;
  string new_recovery_code = 3;
  bool code_saved_checked = 4;
  bool has_persistence_result = 5;
  bool storage_persisted = 6;
  int64 ready_ms = 7;
  Text status_hint_text = 9;
  bool can_confirm_code_saved = 11;
  bool can_prepare = 12;
  bool can_continue_signing = 13;
  bool can_submit_or_refresh = 14;
  bool can_complete = 15;
  bool can_discard = 16;
  bool busy = 18;
  SecurityBannerView banner = 19;
  bool show_setup_reset = 20;
}

message OnboardingViewModel {
  OnboardingMode mode = 1;
  bool can_back = 2;
  bool show_legacy_repair_banner = 3;
  CreateAccountView create = 4;
  JoinPairingView join = 5;
  EmergencyRecoveryView recovery = 6;
}

