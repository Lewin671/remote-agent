  string server_input = 2;
  string recovery_code = 3;
  bool code_saved_checked = 4;
  bool has_persistence_result = 5;
  bool storage_persisted = 6;
  bool can_submit = 7;
  bool busy = 9;
  SecurityBannerView banner = 10;
  bool show_setup_reset = 11;
