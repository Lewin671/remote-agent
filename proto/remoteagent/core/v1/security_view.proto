syntax = "proto3";

package remoteagent.core.v1;

import "remoteagent/core/v1/text.proto";
import "remoteagent/v1/relay.proto";

// ---- Screen Requests (50..55) ----

message AppRootScreenRequest {}

message OnboardingScreenRequest {}

message AddDeviceScreenRequest {}

message AccountSecurityScreenRequest {}

message HandoffScreenRequest {}

message ExitConfirmScreenRequest {}

// ---- Shared Security UI Building Blocks ----

enum SecurityBannerTone {
  SECURITY_BANNER_TONE_UNSPECIFIED = 0;
  SECURITY_BANNER_TONE_INFO = 1;
  SECURITY_BANNER_TONE_WARN = 2;
  SECURITY_BANNER_TONE_ERROR = 3;
}

enum SecurityBannerAction {
  SECURITY_BANNER_ACTION_NONE = 0;
  SECURITY_BANNER_ACTION_RETRY = 1;
  SECURITY_BANNER_ACTION_REFILL = 2;
  SECURITY_BANNER_ACTION_RESTART = 3;
}

message SecurityBannerView {
  bool visible = 1;
  SecurityBannerTone tone = 2;
  Text text = 3;
  SecurityBannerAction action = 4;
}

// ---- AppRootViewModel (Screen 50) ----

enum AppRootStage {
  APP_ROOT_STAGE_UNSPECIFIED = 0;
  APP_ROOT_STAGE_LOADING = 1;
  APP_ROOT_STAGE_BOOTSTRAP_ERROR = 2;
  APP_ROOT_STAGE_ONBOARDING = 3;
  APP_ROOT_STAGE_RETAINED_DENIED = 4;
  APP_ROOT_STAGE_REMOVED = 5;
  APP_ROOT_STAGE_READY = 6;
}

message BootstrapErrorView {
  Text message = 1;
  bool can_retry = 2;
  bool can_reset = 3;
}

message RetainedDeniedView {
  string server = 1;
  bool show_legacy_repair_banner = 6;
}

message RemovedDeviceView {
  bool removal_verified = 1;
  string server = 2;
  bool has_pending_op = 6;
  bool can_verify_pending = 7;
  bool busy = 8;
  Text verify_result_text = 9;
  bool can_retry_login = 10;
}

message AppRootViewModel {
