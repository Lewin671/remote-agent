syntax = "proto3";

package remoteagent.core.v1;

import "remoteagent/core/v1/text.proto";
import "remoteagent/v1/event.proto";
import "remoteagent/v1/local.proto";

enum UsageSortColumn {
  USAGE_SORT_COLUMN_UNSPECIFIED = 0;
  USAGE_SORT_COLUMN_TOKENS = 1;
  USAGE_SORT_COLUMN_CACHE_HIT = 2;
  USAGE_SORT_COLUMN_SPEED = 3;
  USAGE_SORT_COLUMN_TTFT = 4;
}

enum UsageEmptyKind {
  USAGE_EMPTY_KIND_UNSPECIFIED = 0;
  USAGE_EMPTY_KIND_NONE = 1;
  USAGE_EMPTY_KIND_LOADING = 2;
  USAGE_EMPTY_KIND_NOT_FOUND = 3;
  USAGE_EMPTY_KIND_UNSUPPORTED = 4;
  USAGE_EMPTY_KIND_OFFLINE_EMPTY = 5;
  USAGE_EMPTY_KIND_LOAD_ERROR = 6;
  USAGE_EMPTY_KIND_ALL_SOURCES_UNAVAILABLE = 7;
  USAGE_EMPTY_KIND_NO_RECORDS = 8;
}

enum UsageBannerKind {
  USAGE_BANNER_KIND_UNSPECIFIED = 0;
  USAGE_BANNER_KIND_OFFLINE_CACHED = 1;
  USAGE_BANNER_KIND_BACKFILLING = 2;
  USAGE_BANNER_KIND_LOAD_ERROR = 3;
}

message UsageBannerView {
  UsageBannerKind kind = 1;
  bool is_error = 2;
  bool can_retry = 3;
  Text text = 4;
}

message UsageScreenRequest {
  string machine_id = 1;
  remoteagent.v1.Agent focus_agent = 2;
  string focus_model = 3;
  remoteagent.v1.UsageRangePreset preset = 4;
  int64 custom_start_ms = 5;
  int64 custom_end_ms = 6;
}

message UsageCompositionView {
  uint64 uncached_input_tokens = 1;
  uint64 cache_read_tokens = 2;
  uint64 cache_write_tokens = 3;
  uint64 output_tokens = 4;
  uint64 reasoning_output_tokens = 5;
  Text uncached_input_text = 6;
  Text cache_read_text = 7;
  Text cache_write_text = 8;
  Text output_text = 9;
  Text reasoning_output_text = 10;
}

message UsageHeroView {
  bool scrubbing = 1;
  int32 scrub_bucket_index = 2;
  int64 scrub_start_ms = 3;
  int64 scrub_end_ms = 4;
  bool has_selected_model = 5;
  remoteagent.v1.Agent selected_agent = 6;
  string selected_agent_name = 7;
  string selected_model = 8;
  string selected_series_key = 9;
  int32 total_model_count = 10;
  uint64 total_tokens = 11;
  uint64 request_count = 12;
  bool has_share_percent = 13;
  double share_ratio = 14;
  bool has_tokens_delta = 15;
  double tokens_delta_percent = 16;
  bool previous_backfilling = 17;
  UsageCompositionView composition = 18;
  int32 period_composition_rows = 19;
  Text total_tokens_text = 20;
  Text scope_text = 21;
  Text subline_text = 22;
}

message UsageBarBucketView {
  int64 start_ms = 1;
  int64 end_ms = 2;
  uint64 all_tokens = 3;
  uint64 selected_tokens = 4;
  bool has_data = 5;
}

message UsageBarChartView {
  uint64 y_max = 1;
  uint64 y_mid = 2;
  repeated UsageBarBucketView buckets = 3;
  Text y_max_text = 4;
  Text y_mid_text = 5;
}

message UsageStripPointView {
  bool has_value = 1;
  double value = 2;
}

message UsageMetricStripView {
  bool has_value = 1;
  double current_value = 2;
  bool has_range = 3;
  double min_value = 4;
  double max_value = 5;
  double scale_min = 6;
  double scale_max = 7;
  int32 last_valid_index = 8;
  repeated UsageStripPointView all_points = 9;
  repeated UsageStripPointView selected_points = 10;
  Text current_value_text = 11;
  Text min_value_text = 12;
  Text max_value_text = 13;
  bool show_range = 14;
}

message UsageModelRowView {
  remoteagent.v1.Agent agent = 1;
  string agent_name = 2;
  string model = 3;
  string series_key = 4;
  bool selected = 5;
  double share_ratio = 6;
  uint64 total_tokens = 7;
  bool has_cache_hit = 8;
  double cache_hit_rate = 9;
  bool has_speed = 10;
  double speed_p50 = 11;
  bool has_ttft = 12;
  double ttft_p50_ms = 13;
  bool has_tokens_delta = 14;
  double tokens_delta_percent = 15;
  bool previous_backfilling = 16;
  uint64 usage_request_count = 17;
  uint64 speed_request_count = 18;
  Text total_tokens_text = 19;
  Text cache_hit_text = 20;
  Text speed_text = 21;
  Text ttft_text = 22;
  Text delta_text = 23;
}

message UsageAgentSourceView {
  remoteagent.v1.Agent agent = 1;
  remoteagent.v1.UsageSourceState state = 2;
}

message UsageViewModel {
  string machine_id = 1;
  string machine_name = 2;
  bool found = 3;
  bool supported = 4;
  bool online = 5;
  bool loading = 6;
  Text error_text = 7;
  bool cached_offline = 8;
  int64 cached_at_ms = 9;
  bool backfilling = 10;
  int32 backfill_scanned_days = 11;
  int32 backfill_total_days = 12;
  bool previous_period_backfilling = 13;
  remoteagent.v1.UsageRangePreset preset = 14;
  remoteagent.v1.UsageBucketGranularity granularity = 15;
  int64 start_ms = 16;
  int64 end_ms = 17;
  int32 range_days = 18;
  UsageSortColumn sort_by = 19;
  repeated UsageAgentSourceView sources = 20;
  bool has_any_usage = 21;
  UsageHeroView hero = 22;
  UsageBarChartView bar_chart = 23;
  UsageMetricStripView cache_hit_strip = 24;
  UsageMetricStripView output_speed_strip = 25;
  UsageMetricStripView ttft_strip = 26;
  repeated UsageModelRowView rows = 27;
  Text unsupported_footnote = 28;
  Text subtitle = 29;
  UsageEmptyKind empty_kind = 30;
  Text empty_title = 31;
  Text empty_body = 32;
  bool empty_can_retry = 33;
  repeated UsageBannerView banners = 34;
  Text charts_a11y_label = 35;
}

// ---- Events & Effects (Usage & Speed) ----

message UsageScreenOpenEvent {
  string machine_id = 1;
  remoteagent.v1.UsageRangePreset preset = 2;
  int64 custom_start_ms = 3;
  int64 custom_end_ms = 4;
  string timezone = 5;
  int32 tz_offset_minutes = 6;
  repeated int64 bucket_bounds_ms = 7;
  int64 prev_start_ms = 8;
  bool apply_focus = 9;
  remoteagent.v1.Agent focus_agent = 10;
  string focus_model = 11;
}

message UsageScreenRetryEvent {
  string machine_id = 1;
}

message UsageScreenSelectSortEvent {
  string machine_id = 1;
  UsageSortColumn sort_by = 2;
}

message UsageScreenSelectSeriesEvent {
  string machine_id = 1;
  string series_key = 2;
  bool toggle = 3;
}

message UsageScreenScrubEvent {
  string machine_id = 1;
  int32 bucket_index = 2;
  bool clear = 3;
}

message UsageCacheLoadedEvent {
  string machine_id = 1;
  remoteagent.v1.UsageStatsResponse snapshot = 2;
}

message UsageCacheWriteEffect {
  string machine_id = 1;
  remoteagent.v1.UsageStatsResponse snapshot = 2;
}

message UsageCacheWrittenEvent {
  reserved 1;
  string machine_id = 2;
}
