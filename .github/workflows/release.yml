name: Release

# A release is the commit that changes version.properties, pushed to main
# together with its tag. The run belongs to main rather than to the tag so
# that releases share caches: one saved by a tag run is visible to that tag
# alone, which left every release starting cold.
on:
  push:
    branches: [main]
    paths: [version.properties]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to retry (for example v0.2.0). Empty rehearses this branch without publishing.
        required: false
        type: string

permissions:
  contents: read

# Check and build jobs run side by side on the single commit resolved by source;
# R8 alone needs both cores of a hosted runner, so sharing a job with lint and
# tests doubles its time.
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Resolve single source commit
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(sed -n 's/^version=//p' version.properties)
            tag="v$version"
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            commit=$(git rev-parse HEAD)
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            [ "$commit" = "$tag_commit" ] || {
              echo "Tag $tag ($tag_commit) does not match pushed commit $commit" >&2
              exit 1
            }
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git fetch origin "refs/tags/$tag:refs/tags/$tag" main
            commit=$(git rev-parse "refs/tags/$tag^{commit}")
            git merge-base --is-ancestor "$commit" origin/main
          else
            tag=""
            commit=$(git rev-parse HEAD)
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  go-checks:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Cached below under a key sibling jobs and apk.yml can restore.
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-
      - name: Localized resources and new hardcoded text
        run: |
          python3 scripts/i18n.py generate --check
          python3 scripts/i18n.py lint
      - name: Release policy tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Lite protobuf generation drift check
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 scripts/core/check_lite_gen.py
      - name: Go tests
        # The restored build cache also holds test results; a release runs them.
        run: |
          go test -count=1 ./...
          (cd clientcore && go test -count=1 ./...)
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web-checks:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pnpm
        run: |
          npm install --global pnpm@10.19.0
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-web-cache
        with:
          path: build/core/web
          key: core-web-${{ runner.os }}-${{ hashFiles('clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
      - name: Refresh cached web core timestamp
        if: steps.core-web-cache.outputs.cache-hit == 'true'
        run: touch build/core/web/core.wasm
      - name: Web tests and build
        working-directory: web
        env:
          RA_OFFICIAL_RELEASE: 'true'
          VITE_DEFAULT_SERVER: https://ra.remote-agent.top
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm test
          pnpm build

  # What other people deploy from: the daemon and the server for each
  # platform and the web client, built with nothing of our deployment in them.
  dist:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          # scripts/build-go.sh names a build by its tag only when it has the tags.
          fetch-depth: 0
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pnpm
        run: |
          npm install --global pnpm@10.19.0
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-web-cache
        with:
          path: build/core/web
          key: core-web-${{ runner.os }}-${{ hashFiles('clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
      - name: Refresh cached web core timestamp
        if: steps.core-web-cache.outputs.cache-hit == 'true'
        run: touch build/core/web/core.wasm
      - name: Build the archives
        env:
          RA_PUBLIC_DENY: ${{ secrets.RA_PUBLIC_DENY }}
        run: scripts/build-dist.sh
      # Also in a rehearsal, which stops before the release is packaged.
      - name: Refuse anything of our deployment
        env:
          RA_PUBLIC_DENY: ${{ secrets.RA_PUBLIC_DENY }}
        run: python3 scripts/public_scan.py dist
      - name: Install from the archives as a stranger would
        run: scripts/dist-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # The macOS daemons that dist builds on Linux get the Developer ID signature
  # and Apple's notarization here, where codesign runs. The identifier matches
  # scripts/install.sh, so macOS keeps permissions across both kinds of build.
  dist-macos:
    needs: dist
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.dist.outputs.commit }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Sign and notarize the macOS daemons
        env:
          MACOS_SIGNING: ${{ secrets.MACOS_SIGNING }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          set -eu
          test -n "$MACOS_SIGNING" && test -n "$ASC_API_KEY"
          work="$RUNNER_TEMP/macos-signing"
          mkdir -p "$work" && chmod 700 "$work"
          keychain="$work/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$MACOS_SIGNING" | jq -r .certificate | base64 --decode >"$work/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$work/signing.p12" -k "$keychain" -T /usr/bin/codesign \
            -P "$(printf '%s' "$MACOS_SIGNING" | jq -r .password)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # keychain paths without spaces, one word each
          security list-keychains -d user -s "$keychain" $existing
          printf '%s' "$ASC_API_KEY" | jq -r .key >"$work/notary.p8"
          RA_NOTARY_KEY="$work/notary.p8" \
            RA_NOTARY_KEY_ID=$(printf '%s' "$ASC_API_KEY" | jq -r .key_id) \
            RA_NOTARY_ISSUER=$(printf '%s' "$ASC_API_KEY" | jq -r .issuer_id) \
            scripts/sign-macos-dist.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*.tar.gz
          overwrite: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/macos-signing/signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -rf "$RUNNER_TEMP/macos-signing"

  android-checks:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      # :core:test builds the Go server it runs against.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-android-cache
        with:
          path: build/core/android
          key: core-android-${{ runner.os }}-${{ hashFiles('clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
      - name: Refresh cached Android core AAR timestamp
        if: steps.core-android-cache.outputs.cache-hit == 'true'
        run: touch build/core/android/corebind.aar
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-android-host-cache
        with:
          path: build/core/android-host
          key: core-android-host-${{ runner.os }}-${{ hashFiles('clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
      - name: Refresh cached Android host JNI timestamp
        if: steps.core-android-host-cache.outputs.cache-hit == 'true'
        run: touch build/core/android-host/libgojni.so
      # Each Gradle job keeps its own cache: they resolve different
      # dependencies, and a shared key would keep only the first one saved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/*
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-checks-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-checks-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-check-outputs-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/**') }}-${{ needs.source.outputs.commit }}
          restore-keys: gradle-check-outputs-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/**') }}-
      - name: Restore APK configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
          ANDROID_GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
        run: python3 scripts/android-ci.py
      - name: Ensure Android NDK 29.0.14206865
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Android tests and release lint
        working-directory: android
        # Reuse compilation/lint outputs; each Test task's --rerun option
        # forces execution instead of reusing up-to-date or cached results.
        # The workflow enforces this even when checking out an earlier tag.
        # Compose's test Activity is a debugImplementation dependency, so
        # Robolectric UI tests use debug. Release lint and the signed R8
        # build still check the production variant without that Activity.
        run: ./gradlew --no-daemon --no-configuration-cache --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" :core:test --rerun :terminal:testReleaseUnitTest --rerun :app:testDebugUnitTest --rerun :app:lintVitalRelease -PofficialRelease=true -PbuildCommit="$(git rev-parse HEAD)"
      - name: Remove signing material
        if: always()
        run: rm -rf "$HOME/.config/remote-agent" android/app/google-services.json

  android-build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-android-cache
        with:
          path: build/core/android
          key: core-android-${{ runner.os }}-${{ hashFiles('clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
      - name: Refresh cached Android core AAR timestamp
        if: steps.core-android-cache.outputs.cache-hit == 'true'
        run: touch build/core/android/corebind.aar
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/*
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-build-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-build-
      # Task outputs, so a release compiles only the modules it changed: all
      # of them when nothing under android/ did, and R8 alone then runs. The
      # chain of entries restarts when :core or :terminal change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-outputs-${{ hashFiles('android/core/**', 'android/terminal/**', 'android/*.kts', 'android/gradle.properties', 'android/gradle/**') }}-${{ hashFiles('android/**') }}
          restore-keys: gradle-build-outputs-${{ hashFiles('android/core/**', 'android/terminal/**', 'android/*.kts', 'android/gradle.properties', 'android/gradle/**') }}-
      - name: Restore APK configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
          ANDROID_GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
        run: python3 scripts/android-ci.py
      - name: Ensure Android NDK 29.0.14206865
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Signed APK
        working-directory: android
        # android-checks runs the lint that assembleRelease would repeat here.
        # Measured on a hosted runner: R8 is a tenth faster with 4g than
        # with the 2g that suits a laptop, and again with a throughput
        # collector. More heap gains nothing, and compiling Kotlin inside
        # this JVM instead of its daemon is slower.
        run: |
          touch "$RUNNER_TEMP/build-start"
          ./gradlew --no-daemon --no-configuration-cache --parallel -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx2g :app:assembleRelease -x lintVitalRelease -PofficialRelease=true -PbuildCommit="$(git rev-parse HEAD)"
          # Every build adds its R8 output, which no later build can use.
          # Past 150 MB keep only what this build stored.
          outputs="$HOME/.gradle/caches/build-cache-1"
          if [ "$(du -sm "$outputs" | cut -f1)" -gt 150 ]; then
            find "$outputs" -type f ! -newer "$RUNNER_TEMP/build-start" -delete
          fi
      - name: Verify BouncyCastle JCA SPI in release APK
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -rf "$HOME/.config/remote-agent" android/app/google-services.json

  ios-checks:
    needs: source
    runs-on: xcode-27
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'clientcore/go.mod', 'clientcore/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-ios-cache
        with:
          path: build/core/ios
          key: core-ios-${{ runner.os }}-${{ hashFiles('clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
      - name: Refresh cached Corebind timestamp
        if: steps.core-ios-cache.outputs.cache-hit == 'true'
        run: touch build/core/ios/Corebind.xcframework/Info.plist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/RemoteAgentCore/.build
          key: spm-core-${{ runner.os }}-${{ hashFiles('ios/RemoteAgentCore/Package.swift', 'ios/RemoteAgentCore/Package.resolved', 'clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
          restore-keys: spm-core-${{ runner.os }}-
      - name: Build Corebind.xcframework and validate localization
        run: |
          set -euo pipefail
          python3 scripts/i18n.py generate --check
          resources=$(mktemp -d)
          trap 'rm -rf "$resources"' EXIT
          xcrun xcstringstool compile ios/RemoteAgentCore/Localization/Localizable.xcstrings --output-directory "$resources"
          scripts/core/build.sh ios
      - name: Swift package tests (RACoreTests)
        run: swift test --package-path ios/RemoteAgentCore --jobs 4

  # App-hosted simulator tests gate only the App Store upload (its workflow
  # needs the whole Release run to succeed), not the shared release, which
  # would otherwise wait on the slowest runner.
  # Do not add secrets to this job: on failure the .xcresult artifact is uploaded publicly.
  ios-app-checks:
    needs: source
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'clientcore/go.mod', 'clientcore/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-ios-cache
        with:
          path: build/core/ios
          key: core-ios-${{ runner.os }}-${{ hashFiles('clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
      - name: Refresh cached Corebind timestamp
        if: steps.core-ios-cache.outputs.cache-hit == 'true'
        run: touch build/core/ios/Corebind.xcframework/Info.plist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/RemoteAgentCore/.build
          key: spm-core-${{ runner.os }}-${{ hashFiles('ios/RemoteAgentCore/Package.swift', 'ios/RemoteAgentCore/Package.resolved', 'clientcore/**', 'proto/**', 'scripts/core/build.sh', 'go.mod', 'go.sum') }}
          restore-keys: spm-core-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('ios/RemoteAgentCore/Package.swift', 'ios/RemoteAgentCore/Package.resolved', 'ios/RemoteAgent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData
          key: xcode-dd-${{ runner.os }}-${{ hashFiles('ios/RemoteAgent.xcodeproj/project.pbxproj', 'ios/RemoteAgent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/RemoteAgentCore/Package.swift', 'ios/RemoteAgentCore/Package.resolved') }}-${{ needs.source.outputs.commit }}
          restore-keys: xcode-dd-${{ runner.os }}-${{ hashFiles('ios/RemoteAgent.xcodeproj/project.pbxproj', 'ios/RemoteAgent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/RemoteAgentCore/Package.swift', 'ios/RemoteAgentCore/Package.resolved') }}-
      - name: Build Corebind.xcframework and validate localization
        run: |
          set -euo pipefail
          python3 scripts/i18n.py generate --check
          resources=$(mktemp -d)
          trap 'rm -rf "$resources"' EXIT
          xcrun xcstringstool compile ios/RemoteAgentCore/Localization/Localizable.xcstrings --output-directory "$resources"
          scripts/core/build.sh ios
      - name: App build and tests (RemoteAgentTests, excluding performance and UI tests)
        run: |
          set -euo pipefail
          default="iPhone 18 Pro"
          devices=$(xcrun simctl list devices available)
          if printf '%s\n' "$devices" | grep -q "^ *$default ("; then
            destination="platform=iOS Simulator,name=$default"
          else
            id=$(printf '%s\n' "$devices" | sed -n 's/^ *iPhone[^(]* (\([0-9A-F-]\{36\}\)) (Booted).*/\1/p' | head -n 1)
            [ -n "$id" ] || id=$(printf '%s\n' "$devices" | sed -n 's/^ *iPhone[^(]* (\([0-9A-F-]\{36\}\)).*/\1/p' | head -n 1)
            [ -n "$id" ] || { printf '%s\n' "$devices" >&2; exit 1; }
            destination="platform=iOS Simulator,id=$id"
          fi
          result_bundle="$RUNNER_TEMP/ios-app-tests.xcresult"
          rm -rf "$result_bundle"
          set +e
          xcodebuild -quiet -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 -collect-test-diagnostics never -parallel-testing-enabled NO -jobs 4 -project ios/RemoteAgent.xcodeproj -scheme RemoteAgent -destination "$destination" -derivedDataPath "$RUNNER_TEMP/DerivedData" -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" -resultBundlePath "$result_bundle" -only-testing:RemoteAgentTests test
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 ios/scripts/xcresult_failures.py "$result_bundle" >&2 || true
          fi
          rm -rf "$RUNNER_TEMP/DerivedData/Logs"
          exit "$status"
      - name: Upload failed iOS test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app-tests-xcresult
          path: ${{ runner.temp }}/ios-app-tests.xcresult
          retention-days: 3
          if-no-files-found: ignore
      # The App Store archive builds Release, where DEBUG-only code is compiled out;
      # catch a missing Release counterpart here rather than at upload time.
      - name: App Release configuration compiles
        run: xcodebuild -quiet -jobs 4 -project ios/RemoteAgent.xcodeproj -scheme RemoteAgent -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  publish:
    needs: [source, go-checks, web-checks, android-checks, android-build, dist, dist-macos, ios-checks]
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') &&
          needs.source.result == 'success' && needs.go-checks.result == 'success' &&
          needs.web-checks.result == 'success' && needs.android-checks.result == 'success' &&
          needs.android-build.result == 'success' && needs.dist.result == 'success' &&
          needs.dist-macos.result == 'success' &&
          needs.ios-checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Only publishing is serialized, so that "latest" is decided one release
    # at a time. GitHub keeps a single waiting run per group and cancels the
    # rest, which dropped releases while this covered the whole build.
    concurrency:
      group: product-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      # The workflow's publishing tools, even when the product checkout is
      # an older tag. A retry must use the repaired publisher and scanner.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Publishing policy tests
        run: python3 -m unittest discover -s release-tools/scripts -p '*_test.py'
      - name: Validate shared version, artifact origin and skip published releases
        id: plan
        env:
          TAG_INPUT: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          GO_CHECKS_COMMIT: ${{ needs.go-checks.outputs.commit }}
          WEB_CHECKS_COMMIT: ${{ needs.web-checks.outputs.commit }}
          ANDROID_CHECKS_COMMIT: ${{ needs.android-checks.outputs.commit }}
          ANDROID_BUILD_COMMIT: ${{ needs.android-build.outputs.commit }}
          DIST_COMMIT: ${{ needs.dist-macos.outputs.commit }}
          IOS_CHECKS_COMMIT: ${{ needs.ios-checks.outputs.commit }}
        run: |
          RELEASE_TAG=${TAG_INPUT:-v$(sed -n 's/^version=//p' version.properties)}
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          # Both retries and newly built assets must belong to a release tag
          # on main; no unvalidated tag is published.
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release.py validate "$RELEASE_TAG"
          for built_commit in "$SOURCE_COMMIT" "$GO_CHECKS_COMMIT" "$WEB_CHECKS_COMMIT" "$ANDROID_CHECKS_COMMIT" "$ANDROID_BUILD_COMMIT" "$DIST_COMMIT" "$IOS_CHECKS_COMMIT"; do
            [ "$(git rev-parse HEAD)" = "$built_commit" ]
          done
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/is-draft")" = false ]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # A failed lookup must really be a missing release, not auth/network failure.
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /dev/null
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.plan.outputs.skip != 'true'
        with:
          name: apk
          path: android/app/build/outputs/apk/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.plan.outputs.skip != 'true'
        with:
          name: dist
          path: dist
      - name: Verify release APK and package immutable release assets
        if: steps.plan.outputs.skip != 'true'
        env:
          RA_PUBLIC_DENY: ${{ secrets.RA_PUBLIC_DENY }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          python3 release-tools/scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk
          check=$(mktemp -d)
          tar -xzf "dist/remote-agent-$RELEASE_TAG-linux-amd64.tar.gz" -C "$check"
          built=$("$check/remote-agent-$RELEASE_TAG-linux-amd64/remote-agent" --version)
          rm -rf "$check"
          case $built in
            "remote-agent ${RELEASE_TAG#v} ($SOURCE_COMMIT)"*) ;;
            *)
              echo "dist binary commit mismatch: '$built' (expected $SOURCE_COMMIT)" >&2
              exit 1
              ;;
          esac
          scripts/package-release.sh "$RELEASE_TAG"
      # The release is public: its notes are only the tag's user-facing
      # message. A draft is uploaded and checked file by file before it is
      # published, and an older tag rerun never becomes "latest".
      - name: Publish only after every component passes
        if: steps.plan.outputs.skip != 'true'
        env:
          RA_PUBLIC_DENY: ${{ secrets.RA_PUBLIC_DENY }}
          RELEASES_REPO: ${{ github.repository }}
        run: |
          git tag --list "$RELEASE_TAG" --format='%(contents)' > "$RUNNER_TEMP/public-notes.md"
          release-tools/scripts/publish-public.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/public-notes.md" --web-public "$GITHUB_WORKSPACE/web/public"
