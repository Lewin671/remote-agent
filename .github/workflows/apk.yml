name: Build development APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      # Both caches are written by the Release workflow on main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.mod', 'go.sum') }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-checks-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-checks-
      - name: Restore fixed APK signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
          ANDROID_GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
        run: python3 scripts/android-ci.py
      - name: Test and build development APK (push disabled)
        working-directory: android
        run: ./gradlew --no-daemon --no-configuration-cache :core:test :app:testDebugUnitTest :app:assembleDebug -PdevBuild=true -PrequireSigning=true -PbuildCommit="$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-agent-dev-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -rf "$HOME/.config/remote-agent" android/app/google-services.json
