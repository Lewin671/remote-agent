# Generates the iOS client's protocol code from ../proto:
#   cd ios && buf generate
# The Go, web and Android code have their own templates (../buf.gen.yaml,
# ../web/buf.gen.yaml, ../android/buf.gen.yaml); this one only writes into
# RemoteAgentCore/Sources/RAProto.
version: v2
clean: true
inputs:
  - directory: ../proto
managed:
  enabled: true
  override:
    # Generated types are PBEnvelope, PBEvent and so on, which keeps them
    # apart from Foundation's and the core's own names.
    - file_option: swift_prefix
      value: PB
    # Client core shell protos share some short names (Event, ConnState) with
    # remoteagent/v1 and RACore, so they use PBCore.
    - file_option: swift_prefix
      path: remoteagent/core/v1/app.proto
      value: PBCore
    - file_option: swift_prefix
      path: remoteagent/core/v1/home_view.proto
      value: PBCore
    - file_option: swift_prefix
      path: remoteagent/core/v1/project_view.proto
      value: PBCore
    - file_option: swift_prefix
      path: remoteagent/core/v1/new_session_view.proto
      value: PBCore
    - file_option: swift_prefix
      path: remoteagent/core/v1/text.proto
      value: PBCore
    - file_option: swift_prefix
      path: remoteagent/core/v1/usage_view.proto
      value: PBCore
    - file_option: swift_prefix
      path: remoteagent/core/v1/transport.proto
      value: PBCore
    - file_option: swift_prefix
      path: remoteagent/core/v1/terminal_history.proto
      value: PBCore
plugins:
  - remote: buf.build/apple/swift:v1.31.0
    out: RemoteAgentCore/Sources/RAProto
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
