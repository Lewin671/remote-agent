# remote-agent-server behind an existing Caddy container. The server is not
# published on a host port; Caddy reaches it over the shared network.
services:
  remote-agent-server:
    build: .
    image: remote-agent-server:local
    container_name: remote-agent-server
    restart: unless-stopped
    env_file: .env # RA_SETUP_TOKEN, ALLOWED_ORIGINS, RA_FCM_SERVICE_ACCOUNT (optional)
    command: ["--allowed-origins", "${ALLOWED_ORIGINS:-}"]
    volumes:
      - ./data:/data
    mem_limit: 128m
    pids_limit: 128
    read_only: true # the binary writes only to /data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [proxy]
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
