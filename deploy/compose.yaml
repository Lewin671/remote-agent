# remote-agent-server behind Caddy. With Caddy in a container, it reaches the
# server over the shared network and no host port is published. With Caddy on
# the host, add a compose.override.yaml on the server that publishes the port
# on loopback; deploy.sh leaves that file alone.
services:
  remote-agent-server:
    build: .
    image: remote-agent-server:local
    container_name: remote-agent-server
    restart: unless-stopped
    env_file: .env # RA_SETUP_TOKEN, ALLOWED_ORIGINS, RA_FCM_SERVICE_ACCOUNT (optional)
    command: ["--allowed-origins", "${ALLOWED_ORIGINS:-}"]
    volumes:
      - ./data:/data
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [proxy]
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
